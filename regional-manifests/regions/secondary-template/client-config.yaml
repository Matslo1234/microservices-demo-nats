apiVersion: v1
kind: ConfigMap
metadata: {name: nats-client-config, namespace: default}
data:
  REGION_ID: secondary-template
  REGION_KEY: SECONDARY_TEMPLATE
  K8S_CLUSTER_NAME: boutique-secondary
  NATS_CLUSTER_NAME: BOUTIQUE-secondary-template
  NATS_CLUSTER_ROLE: secondary
  STREAM_OWNER_REGION: local
  NATS_SUPERCLUSTER_ENABLED: "true"
  NATS_URL: tls://nats.nats.svc.cluster.local:4222
  NATS_CA_FILE: /etc/nats-ca/ca.crt
  NATS_CONNECT_TIMEOUT: 2s
  NATS_RECONNECT_WAIT: 2s
  NATS_MAX_RECONNECTS: "-1"
  NATS_DRAIN_TIMEOUT: 30s
  NATS_PUBLISH_TIMEOUT: 5s
  NATS_REQUEST_TIMEOUT: 2s
  NATS_PING_INTERVAL: 20s
  NATS_MAX_PINGS_OUT: "2"
  NATS_REQUIRED: "false"
  NATS_REQUIRED_SUBSCRIPTIONS: ""
  NATS_HEALTH_MAX_DISCONNECTED: 15s
  NATS_TRACE_PROPAGATION: w3c
  STOREFRONT_EVENT_STREAM: BOUTIQUE_EVENTS
  STOREFRONT_PROJECTION_DURABLE: storefront-projection-secondary-template-v1
  STOREFRONT_PERSONALIZATION_STREAM: BOUTIQUE_PERSONALIZATION
  STOREFRONT_PERSONALIZATION_DURABLE: storefront-personalization-secondary-template-v1
  STOREFRONT_PRODUCTS_BUCKET: STOREFRONT_PRODUCTS_SECONDARY_TEMPLATE
  STOREFRONT_CARTS_BUCKET: STOREFRONT_CARTS_SECONDARY_TEMPLATE
  STOREFRONT_CONTEXT_BUCKET: STOREFRONT_CONTEXT_SECONDARY_TEMPLATE
  STOREFRONT_ORDERS_BUCKET: STOREFRONT_ORDERS_SECONDARY_TEMPLATE
  STOREFRONT_OPERATIONS_BUCKET: STOREFRONT_OPERATIONS_SECONDARY_TEMPLATE
  STOREFRONT_INITIAL_REPLAY_TIMEOUT: 10m
  LIVE_OPERATION_PREFIX: boutique.live.operation.secondary-template.
  BENCHMARK_RUNS_BUCKET: BENCHMARK_RUNS_SECONDARY_TEMPLATE
  BENCHMARK_ARTIFACTS_BUCKET: BENCHMARK_ARTIFACTS_SECONDARY_TEMPLATE
