apiVersion: v1
kind: ConfigMap
metadata: {name: nats-client-config, namespace: default}
data:
  REGION_ID: us-east-1
  REGION_KEY: US_EAST_1
  K8S_CLUSTER_NAME: eks-cluster
  NATS_CLUSTER_NAME: BOUTIQUE-us-east-1
  NATS_CLUSTER_ROLE: primary
  STREAM_OWNER_REGION: us-east-1
  NATS_SUPERCLUSTER_ENABLED: "true"
  NATS_URL: tls://nats.nats.svc.cluster.local:4222
  NATS_CA_FILE: /etc/nats-ca/ca.crt
  NATS_CONNECT_TIMEOUT: 2s
  NATS_RECONNECT_WAIT: 2s
  NATS_MAX_RECONNECTS: "-1"
  NATS_DRAIN_TIMEOUT: 30s
  NATS_PUBLISH_TIMEOUT: 5s
  NATS_REQUEST_TIMEOUT: 2s
  NATS_PING_INTERVAL: 20s
  NATS_MAX_PINGS_OUT: "2"
  NATS_REQUIRED: "false"
  NATS_REQUIRED_SUBSCRIPTIONS: ""
  NATS_HEALTH_MAX_DISCONNECTED: 15s
  NATS_TRACE_PROPAGATION: w3c
  STOREFRONT_EVENT_STREAM: BOUTIQUE_EVENTS
  STOREFRONT_PROJECTION_DURABLE: storefront-projection-us-east-1-v1
  STOREFRONT_PERSONALIZATION_STREAM: BOUTIQUE_PERSONALIZATION
  STOREFRONT_PERSONALIZATION_DURABLE: storefront-personalization-us-east-1-v1
  STOREFRONT_PRODUCTS_BUCKET: STOREFRONT_PRODUCTS_US_EAST_1
  STOREFRONT_CARTS_BUCKET: STOREFRONT_CARTS_US_EAST_1
  STOREFRONT_CONTEXT_BUCKET: STOREFRONT_CONTEXT_US_EAST_1
  STOREFRONT_ORDERS_BUCKET: STOREFRONT_ORDERS_US_EAST_1
  STOREFRONT_OPERATIONS_BUCKET: STOREFRONT_OPERATIONS_US_EAST_1
  STOREFRONT_INITIAL_REPLAY_TIMEOUT: 10m
  LIVE_OPERATION_PREFIX: boutique.live.operation.us-east-1.
  BENCHMARK_RUNS_BUCKET: BENCHMARK_RUNS_US_EAST_1
  BENCHMARK_ARTIFACTS_BUCKET: BENCHMARK_ARTIFACTS_US_EAST_1
