apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../with-delay
patches:
- target:
    group: apps
    version: v1
    kind: Deployment
    name: shippingservice
  patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: shippingservice
    spec:
      template:
        spec:
          containers:
          - name: server
            env:
            - name: SHIPPING_REJECTION_PERCENTAGE
              value: "20"
