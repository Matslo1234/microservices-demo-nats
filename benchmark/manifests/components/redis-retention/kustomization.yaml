apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
- target:
    group: apps
    version: v1
    kind: Deployment
    name: cartservice
  patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: cartservice
    spec:
      template:
        spec:
          containers:
          - name: server
            env:
            - name: CART_REDIS_RETENTION
              value: "10m"
- target:
    group: apps
    version: v1
    kind: Deployment
    name: checkoutservice
  patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: checkoutservice
    spec:
      template:
        spec:
          containers:
          - name: server
            env:
            - name: CHECKOUT_REDIS_RETENTION
              value: "10m"
