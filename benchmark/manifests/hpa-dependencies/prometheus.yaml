apiVersion: v1
kind: ConfigMap
metadata:
  name: benchmark-prometheus-config
  namespace: observability
  labels:
    app.kubernetes.io/name: benchmark-prometheus
    app.kubernetes.io/component: autoscaling-metrics
    app.kubernetes.io/part-of: online-boutique
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s
      external_labels:
        cluster: online-boutique-benchmark

    rule_files:
    - /etc/prometheus/rules/*.yaml

    scrape_configs:
    - job_name: kubernetes-pods
      kubernetes_sd_configs:
      - role: pod
      relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      - source_labels: [__meta_kubernetes_pod_phase]
        action: drop
        regex: Succeeded|Failed
      - source_labels: [__meta_kubernetes_namespace]
        action: drop
        regex: nats
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scheme]
        action: replace
        target_label: __scheme__
        regex: (https?)
      - source_labels:
        - __address__
        - __meta_kubernetes_pod_annotation_prometheus_io_port
        action: replace
        target_label: __address__
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: pod
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: replace
        target_label: service
        regex: (.+)

    - job_name: nats
      kubernetes_sd_configs:
      - role: endpoints
      relabel_configs:
      - source_labels: [__meta_kubernetes_namespace]
        action: keep
        regex: nats
      - source_labels: [__meta_kubernetes_service_name]
        action: keep
        regex: nats-metrics
      - source_labels: [__meta_kubernetes_endpoint_port_name]
        action: keep
        regex: metrics
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: exporter_namespace
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: exporter_pod

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: benchmark-prometheus-rules
  namespace: observability
  labels:
    app.kubernetes.io/name: benchmark-prometheus
    app.kubernetes.io/component: autoscaling-metrics
    app.kubernetes.io/part-of: online-boutique
data:
  autoscaling.rules.yaml: |
    groups:
    - name: online-boutique-autoscaling
      interval: 5s
      rules:
      # Each expression keeps only the authoritative JetStream consumer leader
      # sample. Static service/namespace labels make the resulting metric
      # directly selectable by autoscaling/v2 external metric selectors.
      - record: boutique_jetstream_consumer_pending
        expr: max(jetstream_consumer_num_pending{account="BOUTIQUE",consumer_name="ad-page-views-v1",is_consumer_leader="true"})
        labels:
          namespace: default
          service: adservice
      - record: boutique_jetstream_consumer_pending
        expr: max(jetstream_consumer_num_pending{account="BOUTIQUE",consumer_name="cart-commands-v1",is_consumer_leader="true"})
        labels:
          namespace: default
          service: cartservice
      - record: boutique_jetstream_consumer_pending
        expr: sum(max by (consumer_name) (jetstream_consumer_num_pending{account="BOUTIQUE",consumer_name=~"checkout-(cart|catalog|currency|order-commands|saga-payment|saga-shipping)-v1",is_consumer_leader="true"}))
        labels:
          namespace: default
          service: checkoutservice
      - record: boutique_jetstream_consumer_pending
        expr: max(jetstream_consumer_num_pending{account="BOUTIQUE",consumer_name="email-order-completed-v1",is_consumer_leader="true"})
        labels:
          namespace: default
          service: emailservice
      - record: boutique_jetstream_consumer_pending
        expr: max(jetstream_consumer_num_pending{account="BOUTIQUE",consumer_name="payment-commands-v1",is_consumer_leader="true"})
        labels:
          namespace: default
          service: paymentservice
      - record: boutique_jetstream_consumer_pending
        expr: sum(max by (consumer_name) (jetstream_consumer_num_pending{account="BOUTIQUE",consumer_name=~"recommendation-(catalog|cart|page-views)-v1",is_consumer_leader="true"}))
        labels:
          namespace: default
          service: recommendationservice
      - record: boutique_jetstream_consumer_pending
        expr: sum(max by (consumer_name) (jetstream_consumer_num_pending{account="BOUTIQUE",consumer_name=~"shipping-(cart-quotes|commands)-v1",is_consumer_leader="true"}))
        labels:
          namespace: default
          service: shippingservice
      - record: boutique_jetstream_consumer_pending
        expr: max(jetstream_consumer_num_pending{account="BOUTIQUE",consumer_name="storefront-projection-v1",is_consumer_leader="true"})
        labels:
          namespace: default
          service: storefrontprojectionservice
---
apiVersion: v1
kind: Service
metadata:
  name: benchmark-prometheus
  namespace: observability
  labels:
    app.kubernetes.io/name: benchmark-prometheus
    app.kubernetes.io/component: autoscaling-metrics
    app.kubernetes.io/part-of: online-boutique
spec:
  selector:
    app.kubernetes.io/name: benchmark-prometheus
  ports:
  - name: http
    port: 9090
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: benchmark-prometheus
  namespace: observability
  labels:
    app.kubernetes.io/name: benchmark-prometheus
    app.kubernetes.io/component: autoscaling-metrics
    app.kubernetes.io/part-of: online-boutique
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: benchmark-prometheus
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: benchmark-prometheus
        app.kubernetes.io/component: autoscaling-metrics
        app.kubernetes.io/part-of: online-boutique
    spec:
      serviceAccountName: benchmark-prometheus
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: prometheus
        image: prom/prometheus:v3.10.0-distroless
        imagePullPolicy: IfNotPresent
        args:
        - --config.file=/etc/prometheus/prometheus.yml
        - --storage.tsdb.path=/prometheus
        - --storage.tsdb.retention.time=2h
        - --storage.tsdb.retention.size=1GB
        ports:
        - name: http
          containerPort: 9090
        readinessProbe:
          httpGet:
            path: /-/ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /-/healthy
            port: http
          initialDelaySeconds: 15
          periodSeconds: 15
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus
          readOnly: true
        - name: rules
          mountPath: /etc/prometheus/rules
          readOnly: true
        - name: data
          mountPath: /prometheus
      volumes:
      - name: config
        configMap:
          name: benchmark-prometheus-config
      - name: rules
        configMap:
          name: benchmark-prometheus-rules
      - name: data
        emptyDir:
          sizeLimit: 2Gi
