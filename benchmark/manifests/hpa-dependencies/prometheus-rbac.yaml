apiVersion: v1
kind: ServiceAccount
metadata:
  name: benchmark-prometheus
  namespace: observability
  labels:
    app.kubernetes.io/name: benchmark-prometheus
    app.kubernetes.io/component: autoscaling-metrics
    app.kubernetes.io/part-of: online-boutique
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: online-boutique-benchmark-prometheus
  labels:
    app.kubernetes.io/name: benchmark-prometheus
    app.kubernetes.io/component: autoscaling-metrics
    app.kubernetes.io/part-of: online-boutique
rules:
- apiGroups: [""]
  resources: ["pods", "services", "endpoints"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["discovery.k8s.io"]
  resources: ["endpointslices"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: online-boutique-benchmark-prometheus
  labels:
    app.kubernetes.io/name: benchmark-prometheus
    app.kubernetes.io/component: autoscaling-metrics
    app.kubernetes.io/part-of: online-boutique
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: online-boutique-benchmark-prometheus
subjects:
- kind: ServiceAccount
  name: benchmark-prometheus
  namespace: observability
