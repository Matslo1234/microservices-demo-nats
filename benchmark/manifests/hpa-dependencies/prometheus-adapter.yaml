apiVersion: v1
kind: ConfigMap
metadata:
  name: benchmark-prometheus-adapter
  namespace: observability
  labels:
    app.kubernetes.io/name: benchmark-prometheus-adapter
    app.kubernetes.io/component: autoscaling-metrics
    app.kubernetes.io/part-of: online-boutique
data:
  config.yaml: |
    rules: []
    externalRules:
    - seriesQuery: 'boutique_jetstream_consumer_pending{namespace!="",service!=""}'
      resources:
        overrides:
          namespace:
            resource: namespace
      name:
        matches: "^boutique_jetstream_consumer_pending$"
        as: "boutique_jetstream_consumer_pending"
      metricsQuery: 'max(<<.Series>>{<<.LabelMatchers>>}) by (namespace, service)'
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: benchmark-prometheus-adapter
  namespace: observability
  labels:
    app.kubernetes.io/name: benchmark-prometheus-adapter
    app.kubernetes.io/component: autoscaling-metrics
    app.kubernetes.io/part-of: online-boutique
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: online-boutique-benchmark-prometheus-adapter
  labels:
    app.kubernetes.io/name: benchmark-prometheus-adapter
    app.kubernetes.io/component: autoscaling-metrics
    app.kubernetes.io/part-of: online-boutique
rules:
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: online-boutique-benchmark-prometheus-adapter
  labels:
    app.kubernetes.io/name: benchmark-prometheus-adapter
    app.kubernetes.io/component: autoscaling-metrics
    app.kubernetes.io/part-of: online-boutique
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: online-boutique-benchmark-prometheus-adapter
subjects:
- kind: ServiceAccount
  name: benchmark-prometheus-adapter
  namespace: observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: online-boutique-benchmark-prometheus-adapter-auth-delegator
  labels:
    app.kubernetes.io/name: benchmark-prometheus-adapter
    app.kubernetes.io/component: autoscaling-metrics
    app.kubernetes.io/part-of: online-boutique
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
- kind: ServiceAccount
  name: benchmark-prometheus-adapter
  namespace: observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: online-boutique-benchmark-prometheus-adapter-auth-reader
  namespace: kube-system
  labels:
    app.kubernetes.io/name: benchmark-prometheus-adapter
    app.kubernetes.io/component: autoscaling-metrics
    app.kubernetes.io/part-of: online-boutique
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: extension-apiserver-authentication-reader
subjects:
- kind: ServiceAccount
  name: benchmark-prometheus-adapter
  namespace: observability
---
apiVersion: v1
kind: Service
metadata:
  name: benchmark-prometheus-adapter
  namespace: observability
  labels:
    app.kubernetes.io/name: benchmark-prometheus-adapter
    app.kubernetes.io/component: autoscaling-metrics
    app.kubernetes.io/part-of: online-boutique
spec:
  selector:
    app.kubernetes.io/name: benchmark-prometheus-adapter
  ports:
  - name: https
    port: 443
    targetPort: https
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: benchmark-prometheus-adapter
  namespace: observability
  labels:
    app.kubernetes.io/name: benchmark-prometheus-adapter
    app.kubernetes.io/component: autoscaling-metrics
    app.kubernetes.io/part-of: online-boutique
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: benchmark-prometheus-adapter
  strategy:
    rollingUpdate:
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: benchmark-prometheus-adapter
        app.kubernetes.io/component: autoscaling-metrics
        app.kubernetes.io/part-of: online-boutique
    spec:
      serviceAccountName: benchmark-prometheus-adapter
      securityContext:
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: adapter
        image: registry.k8s.io/prometheus-adapter/prometheus-adapter:v0.12.0
        imagePullPolicy: IfNotPresent
        args:
        - --secure-port=6443
        - --cert-dir=/var/run/serving-cert
        - --prometheus-url=http://benchmark-prometheus.observability.svc:9090
        - --metrics-relist-interval=15s
        - --metrics-max-age=1m
        - --config=/etc/adapter/config.yaml
        - --v=4
        ports:
        - name: https
          containerPort: 6443
        readinessProbe:
          httpGet:
            path: /healthz
            port: https
            scheme: HTTPS
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: https
            scheme: HTTPS
          initialDelaySeconds: 30
          periodSeconds: 10
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 10001
        volumeMounts:
        - name: config
          mountPath: /etc/adapter
          readOnly: true
        - name: serving-cert
          mountPath: /var/run/serving-cert
      volumes:
      - name: config
        configMap:
          name: benchmark-prometheus-adapter
      - name: serving-cert
        emptyDir: {}
---
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  name: v1beta1.external.metrics.k8s.io
  labels:
    app.kubernetes.io/name: benchmark-prometheus-adapter
    app.kubernetes.io/component: autoscaling-metrics
    app.kubernetes.io/part-of: online-boutique
spec:
  group: external.metrics.k8s.io
  groupPriorityMinimum: 100
  insecureSkipTLSVerify: true
  service:
    name: benchmark-prometheus-adapter
    namespace: observability
    port: 443
  version: v1beta1
  versionPriority: 100
