apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: observability
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: autoscaling-metrics-dns-and-api
  namespace: observability
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 6443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: benchmark-prometheus-scrape
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: benchmark-prometheus
  policyTypes: ["Ingress", "Egress"]
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: benchmark-prometheus-adapter
    ports:
    - protocol: TCP
      port: 9090
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: default
      podSelector:
        matchExpressions:
        - key: app
          operator: Exists
    ports:
    - protocol: TCP
      port: 8080
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: nats
      podSelector:
        matchLabels:
          app.kubernetes.io/name: nats
    ports:
    - protocol: TCP
      port: 7777
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: benchmark-prometheus-adapter
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: benchmark-prometheus-adapter
  policyTypes: ["Ingress", "Egress"]
  ingress:
  # The kube-apiserver aggregation layer calls this Service.
  - ports:
    - protocol: TCP
      port: 6443
  egress:
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: benchmark-prometheus
    ports:
    - protocol: TCP
      port: 9090
