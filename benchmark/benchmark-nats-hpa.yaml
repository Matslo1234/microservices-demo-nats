          periodSeconds: 5
          timeoutSeconds: 5
        resources:
          limits:
            cpu: "4"
            memory: 2Gi
          requests:
            cpu: 400m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
