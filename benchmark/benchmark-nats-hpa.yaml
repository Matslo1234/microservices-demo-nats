          value: 4s
        - name: NATS_METRICS_CACHE_INTERVAL_SECONDS
          value: "1"
        - name: KUBERNETES_METRICS_CACHE_INTERVAL_SECONDS
          value: "5"
        - name: KUBERNETES_METRICS_SNAPSHOT_DEADLINE_SECONDS
          value: "4"
        - name: KUBERNETES_METRICS_WORKERS
          value: "8"
        - name: CADVISOR_SAMPLE_INTERVAL_SECONDS
          value: "30"
        - name: BENCHMARK_METRICS_TOKEN
          valueFrom:
            secretKeyRef:
              key: BENCHMARK_METRICS_TOKEN
              name: benchmark-metrics-auth
              optional: true
        envFrom:
        - configMapRef:
            name: nats-client-config
        - secretRef:
            name: nats-credentials-benchmarkservice
        image: matslo123/benchmarkservice:v0.4.0@sha256:4c679cab7671ee42167f4691b72e17c0be20fc566b34ae4ab5cc6cbb9b6fd2e8
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        name: server
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 2
          periodSeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 48Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /etc/nats-ca
          name: nats-ca
          readOnly: true
      securityContext:
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: benchmarkmetrics
      terminationGracePeriodSeconds: 10
      volumes:
      - configMap:
          name: nats-ca
        name: nats-ca
