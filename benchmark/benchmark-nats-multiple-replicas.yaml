apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkoutservice
  labels:
    app: checkoutservice
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: checkoutservice
  template:
    metadata:
      labels:
        app: checkoutservice
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: checkoutservice
      terminationGracePeriodSeconds: 35
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: server
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
          image: matslo123/checkoutservice@sha256:547be8fe50ff17c4729e4e3db9312b63efe581d7d514f2416354395ca951f63c
          ports:
          - name: health
            containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 5
            failureThreshold: 180
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          env:
          - name: PORT
            value: "8080"
          - name: NATS_REQUIRED
            value: "true"
          - name: NATS_REQUIRED_SUBSCRIPTIONS
            value: "checkout-catalog-v1,checkout-currency-v1,checkout-cart-v1,checkout-order-commands-v1,checkout-saga-shipping-v1,checkout-saga-payment-v1"
          - name: CHECKOUT_REDIS_ADDR
            value: redis-checkout:6379
          - name: CHECKOUT_REDIS_PREFIX
            value: checkout:v1
          - name: CHECKOUT_SAGA_STEP_TIMEOUT
            value: 30s
          - name: CHECKOUT_PROJECTION_CATCHUP_TIMEOUT
            value: 10m
          - name: GOMEMLIMIT
            value: "400MiB"
          envFrom:
          - configMapRef:
              name: nats-client-config
          - secretRef:
              name: nats-credentials-checkoutservice
          volumeMounts:
          - name: nats-ca
            mountPath: /etc/nats-ca
            readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 2Gi
      volumes:
      - name: nats-ca
        configMap:
          name: nats-ca
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-checkout
  labels:
    app: redis-checkout
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis-checkout
  template:
    metadata:
      labels:
        app: redis-checkout
    spec:
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      initContainers:
      - name: volume-permissions
        image: redis:8.2-alpine
        command: ["sh", "-ec", "chown 1000:1000 /data"]
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
            add: ["CHOWN"]
          readOnlyRootFilesystem: true
          runAsNonRoot: false
          runAsUser: 0
        volumeMounts:
        - name: redis-data
          mountPath: /data
        resources:
          requests:
            cpu: 5m
            memory: 8Mi
          limits:
            cpu: 50m
            memory: 64Mi
      containers:
      - name: redis
        image: redis:8.2-alpine
        # Checkout acknowledges JetStream input only after this store commits.
        # Fsync every write keeps that acknowledgement boundary crash-durable.
        args: ["redis-server", "--appendonly", "yes", "--appendfsync", "always"]
        ports:
        - name: redis
          containerPort: 6379
        readinessProbe:
          exec:
            command: ["redis-cli", "ping"]
          periodSeconds: 5
        livenessProbe:
          exec:
            command: ["redis-cli", "ping"]
          periodSeconds: 5
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: redis-data
          mountPath: /data
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 1Gi
      volumes:
      - name: redis-data
        persistentVolumeClaim:
          claimName: redis-checkout-data
---
apiVersion: v1
kind: Service
metadata:
  name: redis-checkout
  labels:
    app: redis-checkout
spec:
  selector:
    app: redis-checkout
  ports:
  - name: redis
    port: 6379
    targetPort: redis
