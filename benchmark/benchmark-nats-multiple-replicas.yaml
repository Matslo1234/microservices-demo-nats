#
# Self-contained NATS benchmark environment with CPU-based autoscaling.
#
# Apply this file to a cluster with a default dynamic StorageClass:
#   kubectl apply -f benchmark/benchmark-nats-hpa.yaml
#
# The nats-setup Deployment creates and reconciles the broker TLS, credentials,
# JetStream encryption key, and per-service client resources. Workloads may
# remain Pending/ContainerCreating until that setup has completed. The
# nats-bootstrap Job then creates the streams and KV buckets used by the
# application. Background backup and advisory-watcher workloads are omitted so
# they cannot perturb benchmark measurements.
#
# Every Online Boutique application microservice is managed by an HPA with
# a 1-10 replica range and a 60% average CPU utilization target. This manifest
# installs metrics-server to provide the resource metrics API. It disables
# kubelet serving-certificate verification for compatibility with ephemeral
# kubeadm benchmark clusters; do not copy that setting into production.
# Benchmarkservice, setup/bootstrap workloads, Redis, metrics-server, and the
# three-node NATS quorum intentionally remain fixed.
#
# After the rollout completes, open the benchmark UI with:
#   kubectl port-forward service/benchmarkservice 8080:8080
#
