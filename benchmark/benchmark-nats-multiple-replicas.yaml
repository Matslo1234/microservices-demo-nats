apiVersion: batch/v1
kind: Job
metadata:
  labels:
    app.kubernetes.io/component: bootstrap
    app.kubernetes.io/name: nats
  name: nats-bootstrap
  namespace: nats
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nats-bootstrap
        app.kubernetes.io/part-of: online-boutique
    spec:
      containers:
      - command:
        - sh
        - /config/bootstrap.sh
        envFrom:
        - secretRef:
            name: nats-admin-credentials
        image: natsio/nats-box:0.19.7-nonroot
        name: bootstrap
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 20m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /config
          name: config
          readOnly: true
        - mountPath: /etc/nats-ca
          name: ca
          readOnly: true
      restartPolicy: OnFailure
      securityContext:
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - configMap:
          items:
          - key: bootstrap.sh
            path: bootstrap.sh
          - key: BOUTIQUE_COMMANDS.json
            path: streams/BOUTIQUE_COMMANDS.json
          - key: BOUTIQUE_EVENTS.json
            path: streams/BOUTIQUE_EVENTS.json
          - key: BOUTIQUE_DLQ.json
            path: streams/BOUTIQUE_DLQ.json
          name: nats-bootstrap
        name: config
      - configMap:
          name: nats-ca
        name: ca
  ttlSecondsAfterFinished: 3600
