apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: setup
    app.kubernetes.io/name: nats-setup
    app.kubernetes.io/part-of: online-boutique
  name: nats-setup
  namespace: nats
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: nats-setup
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/component: setup
        app.kubernetes.io/name: nats-setup
        app.kubernetes.io/part-of: online-boutique
    spec:
      containers:
      - command:
        - /bin/sh
        - /scripts/reconcile.sh
        env:
        - name: RECONCILE_INTERVAL_SECONDS
          value: "21600"
        image: alpine/openssl:3.3.3@sha256:0cb8b9948f86d73f196cef2f828ca0b60e40c7c74d8edf9e60d9990cbb7b8b76
        imagePullPolicy: IfNotPresent
        name: setup
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - test -f /tmp/nats-setup/ready
          failureThreshold: 30
          initialDelaySeconds: 1
          periodSeconds: 2
          timeoutSeconds: 1
        resources:
          limits:
            cpu: 100m
            memory: 2Gi
          requests:
            cpu: 20m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /scripts
          name: script
          readOnly: true
        - mountPath: /tmp
          name: tmp
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: nats-setup
      volumes:
      - configMap:
          defaultMode: 292
          name: nats-setup-script
        name: script
      - emptyDir: {}
        name: tmp
---
apiVersion: apps/v1
kind: Deployment
metadata:
