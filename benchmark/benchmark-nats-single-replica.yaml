apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    app.kubernetes.io/component: backup
    app.kubernetes.io/name: nats
  name: nats-backups
  namespace: nats
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: alerting
    app.kubernetes.io/name: nats-advisory-watcher
  name: nats-advisory-watcher
  namespace: nats
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nats-advisory-watcher
  template:
    metadata:
      labels:
        app.kubernetes.io/component: alerting
        app.kubernetes.io/name: nats-advisory-watcher
        app.kubernetes.io/part-of: online-boutique
    spec:
      containers:
      - command:
        - sh
        - -ec
        - |
          until nats --server="${NATS_URL}" --user="${NATS_USER}" --password="${NATS_PASSWORD}" \
            --tlsca=/etc/nats-ca/ca.crt account info >/dev/null 2>&1; do
            echo "waiting for NATS"
            sleep 2
          done
          echo "watching JetStream max-delivery advisories"
          exec nats --server="${NATS_URL}" --user="${NATS_USER}" --password="${NATS_PASSWORD}" \
            --tlsca=/etc/nats-ca/ca.crt sub '$JS.EVENT.ADVISORY.CONSUMER.MAX_DELIVERIES.>' --raw
        envFrom:
        - secretRef:
            name: nats-messageoperations-credentials
        image: natsio/nats-box:0.19.7-nonroot
        name: watcher
        resources:
          limits:
            cpu: 50m
            memory: 2Gi
          requests:
            cpu: 10m
            memory: 16Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /etc/nats-ca
          name: ca
          readOnly: true
      securityContext:
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - configMap:
          name: nats-ca
        name: ca
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: setup
    app.kubernetes.io/name: nats-setup
    app.kubernetes.io/part-of: online-boutique
  name: nats-setup
  namespace: nats
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nats-setup
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/component: setup
        app.kubernetes.io/name: nats-setup
        app.kubernetes.io/part-of: online-boutique
    spec:
      containers:
      - command:
        - /bin/sh
        - /scripts/reconcile.sh
        env:
        - name: RECONCILE_INTERVAL_SECONDS
          value: "21600"
        image: alpine/openssl:3.3.3@sha256:0cb8b9948f86d73f196cef2f828ca0b60e40c7c74d8edf9e60d9990cbb7b8b76
        imagePullPolicy: IfNotPresent
        name: setup
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - test -f /tmp/nats-setup/ready
          failureThreshold: 30
          initialDelaySeconds: 1
          periodSeconds: 2
          timeoutSeconds: 1
        resources:
          limits:
            cpu: 100m
            memory: 2Gi
          requests:
            cpu: 20m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /scripts
          name: script
          readOnly: true
        - mountPath: /tmp
          name: tmp
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: nats-setup
      volumes:
      - configMap:
          defaultMode: 292
          name: nats-setup-script
        name: script
      - emptyDir: {}
        name: tmp
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app.kubernetes.io/name: nats
    app.kubernetes.io/part-of: online-boutique
  name: nats
  namespace: nats
spec:
  podManagementPolicy: Parallel
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: nats
  serviceName: nats-headless
  template:
    metadata:
      annotations:
        prometheus.io/path: /metrics
        prometheus.io/port: "7777"
        prometheus.io/scrape: "true"
      labels:
        app.kubernetes.io/name: nats
        app.kubernetes.io/part-of: online-boutique
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: nats
              topologyKey: kubernetes.io/hostname
            weight: 100
      containers:
      - args:
        - -c
        - /etc/nats-config/nats.conf
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        envFrom:
        - secretRef:
            name: nats-server-auth
        image: nats:2.14.3-alpine
        imagePullPolicy: IfNotPresent
        lifecycle:
          preStop:
            exec:
              command:
              - nats-server
              - -sl
              - ldm=/var/run/nats/nats.pid
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz?js-server-only=true
            port: monitor
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 2
        name: nats
        ports:
        - containerPort: 4222
          name: client
        - containerPort: 6222
          name: cluster
        - containerPort: 8222
          name: monitor
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz?js-enabled-only=true
            port: monitor
          periodSeconds: 5
          timeoutSeconds: 2
        resources:
          limits:
            cpu: "2"
            memory: 4Gi
          requests:
            cpu: 500m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        startupProbe:
          failureThreshold: 60
          httpGet:
            path: /healthz?js-enabled-only=true
            port: monitor
          periodSeconds: 2
        volumeMounts:
        - mountPath: /etc/nats-config
          name: config
          readOnly: true
        - mountPath: /etc/nats/tls
          name: tls
          readOnly: true
        - mountPath: /data
          name: jetstream
        - mountPath: /var/run/nats
          name: run
      - args:
        - -p
        - "7777"
        - -varz
        - -routez
        - -subz
        - -jsz=all
        - http://127.0.0.1:8222
        image: natsio/prometheus-nats-exporter:0.20.1
        imagePullPolicy: IfNotPresent
        name: metrics
        ports:
        - containerPort: 7777
          name: metrics
        resources:
          limits:
            cpu: 250m
            memory: 512Mi
          requests:
            cpu: 50m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
      initContainers:
      - command:
        - sh
        - -ec
        - chown 1000:1000 /data
        image: busybox:1.37.0
        name: volume-permissions
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add:
            - CHOWN
            drop:
            - ALL
          runAsNonRoot: false
          runAsUser: 0
        volumeMounts:
        - mountPath: /data
          name: jetstream
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: nats
      terminationGracePeriodSeconds: 60
      topologySpreadConstraints:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: nats
        maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
      volumes:
      - configMap:
          name: nats-server-config
        name: config
      - name: tls
        secret:
          secretName: nats-server-tls
      - emptyDir: {}
        name: run
  updateStrategy:
    type: RollingUpdate
