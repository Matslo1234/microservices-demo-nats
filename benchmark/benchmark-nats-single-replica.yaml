            secretKeyRef:
              key: BENCHMARK_METRICS_TOKEN
              name: benchmark-metrics-auth
              optional: true
        image: matslo123/benchmarkservice:v0.4.0@sha256:b08f16c5add304b4b4e662c396e25cad978a2f7dc8e238a0b982d0585d76916e
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        name: server
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 2
          periodSeconds: 5
        resources:
