apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app.kubernetes.io/component: backup
    app.kubernetes.io/name: nats
  name: nats-backup
  namespace: nats
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        metadata:
          labels:
            app.kubernetes.io/name: nats-backup
            app.kubernetes.io/part-of: online-boutique
        spec:
          containers:
          - command:
            - sh
            - -ec
            - |
              destination="/backups/$(date -u +%Y%m%dT%H%M%SZ)"
              nats --server="${NATS_URL}" --user="${NATS_USER}" --password="${NATS_PASSWORD}" \
                --tlsca=/etc/nats-ca/ca.crt account backup "${destination}" \
                --consumers --check --critical-warnings --force
              find /backups -mindepth 1 -maxdepth 1 -type d -mtime +14 -exec rm -rf {} +
            envFrom:
            - secretRef:
                name: nats-admin-credentials
            image: natsio/nats-box:0.19.7-nonroot
            name: backup
            resources:
              limits:
                cpu: 200m
                memory: 256Mi
              requests:
                cpu: 20m
                memory: 32Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
            volumeMounts:
            - mountPath: /backups
              name: backups
            - mountPath: /etc/nats-ca
              name: ca
              readOnly: true
          initContainers:
          - command:
            - sh
            - -ec
            - chown 1000:1000 /backups
            image: busybox:1.37.0
            name: volume-permissions
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                add:
                - CHOWN
                drop:
                - ALL
              runAsNonRoot: false
              runAsUser: 0
            volumeMounts:
            - mountPath: /backups
              name: backups
          restartPolicy: OnFailure
          securityContext:
            fsGroup: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          volumes:
          - name: backups
            persistentVolumeClaim:
              claimName: nats-backups
          - configMap:
              name: nats-ca
            name: ca
  schedule: 17 2 * * *
  successfulJobsHistoryLimit: 3
  timeZone: Etc/UTC
