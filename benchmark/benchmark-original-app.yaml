---
apiVersion: v1
kind: Service
metadata:
  name: benchmark-state
  namespace: benchmark-system
spec:
  selector:
    app: benchmark-state
  ports:
  - name: nats
    port: 4222
    targetPort: nats
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: benchmark-state
  namespace: benchmark-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: benchmark-state
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: benchmark-state
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: nats
        image: nats:2.14.3-alpine
        args:
        - --jetstream
        - --store_dir=/data
        ports:
        - name: nats
          containerPort: 4222
        readinessProbe:
          tcpSocket:
            port: nats
          periodSeconds: 2
        livenessProbe:
          tcpSocket:
            port: nats
          periodSeconds: 10
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            # Raw exports and archives are retained in the local Object Store.
            # Leave enough cache/recovery headroom across repeated runs.
            memory: 2Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: state
          mountPath: /data
      volumes:
      - name: state
        emptyDir:
          sizeLimit: 5Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: benchmark-state-bootstrap
  namespace: benchmark-system
spec:
  backoffLimit: 12
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      containers:
      - name: bootstrap
        image: natsio/nats-box:0.19.7-nonroot
        command:
        - /bin/sh
        - -ec
        - |
          server=nats://benchmark-state:4222
          until nats --server="${server}" account info >/dev/null 2>&1; do
            sleep 1
          done
          if ! nats --server="${server}" kv info BENCHMARK_RUNS >/dev/null 2>&1; then
            nats --server="${server}" kv add BENCHMARK_RUNS \
              --history=10 --replicas=1 --storage=file \
              --max-bucket-size=536870912
          fi
          if ! nats --server="${server}" object info BENCHMARK_ARTIFACTS >/dev/null 2>&1; then
            nats --server="${server}" object add BENCHMARK_ARTIFACTS \
              --replicas=1 --storage=file \
              --max-bucket-size=4294967296
          fi
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          readOnlyRootFilesystem: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-client-config
data:
  NATS_URL: nats://benchmark-state.benchmark-system.svc:4222
  NATS_CA_FILE: ""
  NATS_CONNECT_TIMEOUT: 2s
  NATS_RECONNECT_WAIT: 2s
  NATS_MAX_RECONNECTS: "-1"
  NATS_PING_INTERVAL: 20s
  NATS_MAX_PINGS_OUT: "2"
  NATS_PUBLISH_TIMEOUT: 5s
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-ca
data: {}
---
apiVersion: v1
kind: Secret
metadata:
  name: nats-credentials-benchmarkservice
