  verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: benchmarkservice-jobs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: benchmarkservice-jobs
