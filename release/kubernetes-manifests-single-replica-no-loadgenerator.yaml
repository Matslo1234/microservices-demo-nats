apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app: redis-cart-cluster
    app.kubernetes.io/component: backing-store
  name: redis-cart-cluster
spec:
  podManagementPolicy: Parallel
  replicas: 1
  selector:
    matchLabels:
      app: redis-cart-cluster
      app.kubernetes.io/component: server
  serviceName: redis-cart-cluster-headless
  template:
    metadata:
      labels:
        app: redis-cart-cluster
        app.kubernetes.io/component: server
        app.kubernetes.io/part-of: online-boutique
    spec:
      containers:
      - args:
        - |-
          exec redis-server \
            --bind 0.0.0.0 \
            --protected-mode no \
            --port 6379 \
            --appendonly yes \
            --appendfsync always \
            --save 3600 1
        command:
        - sh
        - -ec
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        image: redis:8.2-alpine
        livenessProbe:
          exec:
            command:
            - redis-cli
            - PING
          periodSeconds: 10
        name: redis
        ports:
        - containerPort: 6379
          name: redis
        readinessProbe:
          exec:
            command:
            - redis-cli
            - PING
          periodSeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 50m
            memory: 96Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        startupProbe:
          exec:
            command:
            - redis-cli
            - PING
          failureThreshold: 90
          periodSeconds: 2
        volumeMounts:
        - mountPath: /data
          name: data
      initContainers:
      - command:
        - sh
        - -ec
        - chown 1000:1000 /data
        image: redis:8.2-alpine
