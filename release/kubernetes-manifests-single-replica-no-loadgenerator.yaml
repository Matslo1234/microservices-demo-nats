  name: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      annotations:
        prometheus.io/path: /metrics
        prometheus.io/port: "8080"
        prometheus.io/scrape: "true"
        sidecar.istio.io/rewriteAppHTTPProbers: "true"
      labels:
        app: frontend
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - podAffinityTerm:
              labelSelector: {}
              matchLabelKeys:
              - app
              topologyKey: kubernetes.io/hostname
            weight: 100
      containers:
      - env:
        - name: PORT
          value: "8080"
        - name: NATS_REQUIRED
          value: "true"
        - name: NATS_REQUIRED_SUBSCRIPTIONS
          value: boutique.qry.storefront.home.v1,boutique.qry.storefront.product.v1,boutique.qry.storefront.cart.v1,boutique.qry.storefront.checkout.v1,boutique.qry.storefront.currencies.v1,boutique.qry.storefront.product-meta.v1,boutique.qry.storefront.operation.v1,boutique.qry.storefront.order.v1,boutique.qry.payment.tokenize.v1
        - name: CART_OPERATION_WAIT_TIMEOUT
          value: 750ms
        - name: GOMEMLIMIT
          value: 400MiB
        - name: NATS_REQUEST_TIMEOUT
          value: 8s
        - name: PAGE_VIEW_PUBLISH_MAX_PENDING
          value: "512"
        - name: ENABLE_PROFILER
          value: "0"
        - name: ENABLE_TRACING
          value: "1"
        envFrom:
        - configMapRef:
            name: nats-client-config
        - secretRef:
            name: nats-credentials-frontend
        - secretRef:
            name: global-application-secrets
        image: matslo123/frontend:v0.4.0@sha256:53a2861f3ef010cf28e847cdc4262afb8bc590c4602f0c74d8cfbf6951798b3b
        livenessProbe:
          failureThreshold: 6
          httpGet:
            httpHeaders:
            - name: Cookie
              value: shop_session-id=x-liveness-probe
            path: /_healthz
            port: 8080
          initialDelaySeconds: 10
          timeoutSeconds: 3
        name: server
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            httpHeaders:
            - name: Cookie
              value: shop_session-id=x-readiness-probe
            path: /_readyz
            port: 8080
          initialDelaySeconds: 10
          timeoutSeconds: 5
        resources:
          limits:
            cpu: "1"
            memory: 2Gi
          requests:
            cpu: 300m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /etc/nats-ca
          name: nats-ca
          readOnly: true
      initContainers:
      - command:
        - sh
        - -ec
        - |
          for attempt in $(seq 1 60); do
            response="$(nats --server="${NATS_URL}" --user="${NATS_USER}" --password="${NATS_PASSWORD}" --tlsca=/etc/nats-ca/ca.crt --timeout=2s request boutique.qry.storefront.home.v1 '{"currency_code":"USD"}' 2>/dev/null || true)"
            case "${response}" in
              *'"products"'*)
                echo "storefront projection contains the initial catalog and currency snapshots"
                exit 0
                ;;
            esac
            echo "waiting for initial storefront projection (${attempt}/60)"
            sleep 2
          done
          echo "storefront projection did not initialize within two minutes" >&2
          exit 1
        envFrom:
        - configMapRef:
            name: nats-client-config
        - secretRef:
            name: nats-credentials-frontend
        image: natsio/nats-box:0.19.7-nonroot
        name: wait-for-storefront-projection
        resources:
          limits:
            cpu: 100m
            memory: 2Gi
          requests:
            cpu: 20m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /etc/nats-ca
          name: nats-ca
          readOnly: true
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      serviceAccountName: frontend
      terminationGracePeriodSeconds: 35
      topologySpreadConstraints:
      - labelSelector: {}
        matchLabelKeys:
        - app
        maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
      volumes:
      - configMap:
          name: nats-ca
        name: nats-ca
