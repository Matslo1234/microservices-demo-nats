        - containerPort: 16379
          name: cluster-bus
        readinessProbe:
          exec:
            command:
            - sh
            - -ec
            - redis-cli CLUSTER INFO | grep -q '^cluster_state:ok'
          periodSeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 2Gi
          requests:
            cpu: 50m
            memory: 96Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        startupProbe:
          exec:
            command:
            - redis-cli
            - PING
          failureThreshold: 90
          periodSeconds: 2
        volumeMounts:
        - mountPath: /data
          name: data
      initContainers:
      - command:
        - sh
        - -ec
        - chown 1000:1000 /data
        image: redis:8.2-alpine
        name: volume-permissions
        resources:
          limits:
            cpu: 50m
            memory: 64Mi
          requests:
            cpu: 5m
            memory: 8Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add:
            - CHOWN
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: false
          runAsUser: 0
        volumeMounts:
        - mountPath: /data
          name: data
      - command:
        - sh
        - /config/repair-topology.sh
        image: redis:8.2-alpine
        name: repair-topology
        resources:
          limits:
            cpu: 50m
            memory: 64Mi
          requests:
            cpu: 5m
            memory: 8Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /data
          name: data
        - mountPath: /config
          name: redis-cluster-bootstrap
          readOnly: true
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
      - labelSelector:
          matchLabels:
            app: redis-checkout-cluster
            app.kubernetes.io/component: server
        maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
      volumes:
      - configMap:
          name: redis-cluster-bootstrap
        name: redis-cluster-bootstrap
  volumeClaimTemplates:
  - metadata:
      labels:
        app: redis-checkout-cluster
        app.kubernetes.io/component: backing-store
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 2Gi
