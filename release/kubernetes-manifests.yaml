apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app: redis-cart-cluster
    app.kubernetes.io/component: backing-store
  name: redis-cart-cluster
spec:
  podManagementPolicy: Parallel
  replicas: 6
  selector:
    matchLabels:
      app: redis-cart-cluster
      app.kubernetes.io/component: server
  serviceName: redis-cart-cluster-headless
  template:
    metadata:
      labels:
        app: redis-cart-cluster
        app.kubernetes.io/component: server
        app.kubernetes.io/part-of: online-boutique
    spec:
      containers:
      - args:
        - |
          exec redis-server \
            --bind 0.0.0.0 \
            --protected-mode no \
            --port 6379 \
            --appendonly yes \
            --appendfsync always \
            --cluster-enabled yes \
            --cluster-config-file /data/nodes.conf \
            --cluster-node-timeout 5000 \
            --cluster-announce-hostname "${POD_NAME}.redis-cart-cluster-headless.${POD_NAMESPACE}.svc.cluster.local" \
            --cluster-announce-port 6379 \
            --cluster-announce-bus-port 16379 \
            --cluster-preferred-endpoint-type hostname
        command:
        - sh
        - -ec
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        image: redis:8.2-alpine
        livenessProbe:
          exec:
            command:
            - redis-cli
            - PING
          periodSeconds: 10
        name: redis
        ports:
        - containerPort: 6379
          name: redis
        - containerPort: 16379
          name: cluster-bus
        readinessProbe:
          exec:
            command:
            - sh
            - -ec
            - redis-cli CLUSTER INFO | grep -q '^cluster_state:ok'
          periodSeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 50m
            memory: 96Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        startupProbe:
          exec:
            command:
            - redis-cli
            - PING
          failureThreshold: 90
          periodSeconds: 2
        volumeMounts:
        - mountPath: /data
          name: data
      initContainers:
      - command:
        - sh
        - -ec
        - chown 1000:1000 /data
        image: redis:8.2-alpine
        name: volume-permissions
        resources:
          limits:
            cpu: 50m
            memory: 64Mi
          requests:
            cpu: 5m
            memory: 8Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add:
            - CHOWN
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: false
          runAsUser: 0
        volumeMounts:
        - mountPath: /data
          name: data
      - command:
        - sh
        - /config/repair-topology.sh
        image: redis:8.2-alpine
        name: repair-topology
        resources:
          limits:
            cpu: 50m
            memory: 64Mi
          requests:
            cpu: 5m
            memory: 8Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /data
          name: data
        - mountPath: /config
          name: redis-cluster-bootstrap
          readOnly: true
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
      - labelSelector:
          matchLabels:
            app: redis-cart-cluster
            app.kubernetes.io/component: server
        maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
      volumes:
      - configMap:
          name: redis-cluster-bootstrap
        name: redis-cluster-bootstrap
  volumeClaimTemplates:
  - metadata:
      labels:
        app: redis-cart-cluster
        app.kubernetes.io/component: backing-store
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 2Gi
