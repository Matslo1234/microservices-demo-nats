apiVersion: batch/v1
kind: Job
metadata:
  labels:
    app: redis-cart-cluster-bootstrap
    app.kubernetes.io/component: bootstrap
  name: redis-cart-cluster-bootstrap
spec:
  backoffLimit: 12
  template:
    metadata:
      labels:
        app: redis-cart-cluster-bootstrap
        app.kubernetes.io/component: bootstrap
    spec:
      containers:
      - command:
        - sh
        - /config/bootstrap.sh
        env:
        - name: CLUSTER_NAME
          value: redis-cart-cluster
        - name: HEADLESS_SERVICE
          value: redis-cart-cluster-headless
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        image: redis:8.2-alpine
        name: bootstrap
        resources:
          limits:
            cpu: 100m
            memory: 64Mi
          requests:
            cpu: 10m
            memory: 16Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /config
          name: config
          readOnly: true
      restartPolicy: OnFailure
      securityContext:
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - configMap:
          defaultMode: 365
          name: redis-cluster-bootstrap
        name: config
  ttlSecondsAfterFinished: 3600
