    until nats ${nats_args} account info >/dev/null 2>&1; do
      echo "waiting for the local NATS JetStream account"
      sleep 2
    done

    assert_regional_name() {
      case "$1" in
        *_"${REGION_KEY}") ;;
        *) echo "regional asset $1 must end in _${REGION_KEY}" >&2; exit 1 ;;
      esac
    }

    assert_backing_stream() {
      stream=$1
      history=$2
      max_age=$3
      max_bytes=$4
      compact="$(nats ${nats_args} stream info "${stream}" --json | tr -d '[:space:]')"
      for expected in \
        "\"num_replicas\":${NATS_JETSTREAM_REPLICAS}" \
        "\"storage\":\"file\"" \
        "\"max_age\":${max_age}" \
        "\"max_bytes\":${max_bytes}"; do
        printf '%s' "${compact}" | grep -F "${expected}" >/dev/null || {
          echo "${stream} does not match ${expected}" >&2
          exit 1
        }
      done
      if [ "${NATS_CLUSTERED}" = true ]; then
        printf '%s' "${compact}" | grep -F "\"cluster\":\"${NATS_CLUSTER_NAME}\"" >/dev/null || exit 1
      fi
      if [ "${history}" != skip ]; then
        printf '%s' "${compact}" | grep -F "\"max_msgs_per_subject\":${history}" >/dev/null || {
          echo "${stream} has the wrong history limit" >&2
          exit 1
        }
      fi
    }

    ensure_kv() {
      bucket=$1
      history=$2
      ttl=$3
      max_age=$4
      max_bytes=$5
      assert_regional_name "${bucket}"
      if nats ${nats_args} kv info "${bucket}" >/dev/null 2>&1; then
        nats ${nats_args} kv edit "${bucket}" --history="${history}" --replicas="${NATS_JETSTREAM_REPLICAS}" \
          --ttl="${ttl}" --max-bucket-size="${max_bytes}" ${placement_args}
      else
        nats ${nats_args} kv add "${bucket}" --history="${history}" --replicas="${NATS_JETSTREAM_REPLICAS}" \
          --storage=file --ttl="${ttl}" --max-bucket-size="${max_bytes}" ${placement_args}
      fi
      assert_backing_stream "KV_${bucket}" "${history}" "${max_age}" "${max_bytes}"
    }

    ensure_object() {
      bucket=$1
      assert_regional_name "${bucket}"
      if nats ${nats_args} object info "${bucket}" >/dev/null 2>&1; then
        nats ${nats_args} object edit "${bucket}" --replicas="${NATS_JETSTREAM_REPLICAS}" \
          --max-bucket-size=4294967296 ${placement_args}
      else
        nats ${nats_args} object add "${bucket}" --replicas="${NATS_JETSTREAM_REPLICAS}" --storage=file \
          --max-bucket-size=4294967296 ${placement_args}
      fi
      assert_backing_stream "OBJ_${bucket}" skip 0 4294967296
    }

    ensure_kv "${STOREFRONT_PRODUCTS_BUCKET}" 5 0s 0 536870912
    ensure_kv "${STOREFRONT_CARTS_BUCKET}" 2 0s 0 536870912
    ensure_kv "${STOREFRONT_CONTEXT_BUCKET}" 2 1h 3600000000000 536870912
    ensure_kv "${STOREFRONT_ORDERS_BUCKET}" 2 0s 0 2147483648
    ensure_kv "${STOREFRONT_OPERATIONS_BUCKET}" 10 24h 86400000000000 805306368
    ensure_kv "${BENCHMARK_RUNS_BUCKET}" 10 0s 0 536870912
    ensure_object "${BENCHMARK_ARTIFACTS_BUCKET}"
    nats ${nats_args} kv list
    nats ${nats_args} object ls
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/component: regional-bootstrap
    app.kubernetes.io/name: nats
  name: nats-regional-bootstrap
  namespace: nats
---
apiVersion: v1
data:
  cluster.conf: |
    cluster {
      name: $NATS_CLUSTER_NAME
      listen: 0.0.0.0:6222
      # Kubernetes clients connect through the TLS service name. Do not gossip
      # pod IPs, which are not stable and are intentionally absent from the cert.
      no_advertise: true
      connect_retries: 120
      connect_backoff: true
      routes: [
        __NATS_CLUSTER_ROUTES__
      ]
      tls {
        cert_file: "/etc/nats/tls/tls.crt"
        key_file: "/etc/nats/tls/tls.key"
        ca_file: "/etc/nats/tls/ca.crt"
        min_version: "1.2"
        timeout: 2
      }
    }
  nats.conf: |
    server_name: $NATS_SERVER_NAME
    server_tags: [$NATS_REGION_TAG, $NATS_CLUSTER_TAG, $NATS_NODE_TAG]
    pid_file: "/var/run/nats/nats.pid"
    listen: 0.0.0.0:4222
    http: 0.0.0.0:8222
    max_payload: 1MB
    write_deadline: "10s"
    lame_duck_duration: "30s"
    lame_duck_grace_period: "10s"

    tls {
      cert_file: "/etc/nats/tls/tls.crt"
      key_file: "/etc/nats/tls/tls.key"
      ca_file: "/etc/nats/tls/ca.crt"
      min_version: "1.2"
      timeout: 2
    }

    include ./cluster.conf

    # Empty in standalone mode. A regional supercluster overlay supplies a
    # gateway block with exact remote cluster names and seed URLs.
    include ./gateway.conf

    jetstream {
      store_dir: "/data/jetstream"
      max_memory_store: 256MB
      # Bootstrap reserves 12.7 GB across the R3 stream, KV, and object-store
      # replicas placed on each member. Keep capacity above that reservation
      # while retaining filesystem headroom on the 20 Gi PVC.
      max_file_store: 16GB
      cipher: "aes"
      key: $JETSTREAM_ENCRYPTION_KEY
    }

    accounts {
      SYS {
        users: [
          {user: "system", password: $SYS_PASSWORD}
        ]
      }

      BOUTIQUE {
        jetstream: enabled
        users: [
          {
            user: "admin", password: $ADMIN_PASSWORD,
            permissions: {publish: [">"], subscribe: [">"]}
          },
          {
            user: "frontend", password: $FRONTEND_PASSWORD,
            permissions: {
              publish: [
                "boutique.cmd.cart.add-item.v1", "boutique.cmd.cart.clear.v1",
                "boutique.cmd.shipping.calculate-cart-quote.v1",
                "boutique.cmd.order.submit.v1",
                "boutique.evt.storefront.page-viewed.v1",
                "boutique.evt.storefront.operation-accepted.v1",
                "boutique.qry.storefront.home.v1",
                "boutique.qry.storefront.product.v1",
                "boutique.qry.storefront.cart.v1",
                "boutique.qry.storefront.checkout.v1",
                "boutique.qry.storefront.currencies.v1",
                "boutique.qry.storefront.product-meta.v1",
                "boutique.qry.storefront.search-products.v1",
                "boutique.qry.storefront.order.v1",
                "boutique.qry.storefront.operation.v1",
                "boutique.qry.payment.tokenize.v1", "$JS.API.INFO",
                "$JS.API.STREAM.INFO.*"
              ],
              subscribe: ["_INBOX.>", "__NATS_FRONTEND_LIVE_SUBJECT__"]
            }
          },
          {
            user: "storefrontprojectionservice", password: $STOREFRONTPROJECTIONSERVICE_PASSWORD,
            permissions: {
              publish: [
                "$JS.API.>", "$JS.ACK.>", "$JS.FC.>", "_INBOX.>",
                "__NATS_PROJECTION_PRODUCTS_SUBJECT__", "__NATS_PROJECTION_CARTS_SUBJECT__",
                "__NATS_PROJECTION_CONTEXT_SUBJECT__", "__NATS_PROJECTION_ORDERS_SUBJECT__",
                "__NATS_PROJECTION_OPERATIONS_SUBJECT__",
                "__NATS_FRONTEND_LIVE_SUBJECT__"
              ],
              subscribe: ["_INBOX.>", "$SRV.>", "boutique.evt.>", "boutique.qry.storefront.>"]
            }
          },
          {
            user: "productcatalogservice", password: $PRODUCTCATALOGSERVICE_PASSWORD,
            permissions: {
              publish: [
                "boutique.evt.catalog.product-upserted.v1",
                "boutique.evt.catalog.product-removed.v1",
                "boutique.evt.catalog.snapshot-completed.v1",
                "$JS.API.>", "$KV.BOOTSTRAP_CLAIMS.>"
              ],
              subscribe: ["_INBOX.>"]
            }
          },
          {
            user: "currencyservice", password: $CURRENCYSERVICE_PASSWORD,
            permissions: {
              publish: [
                "boutique.evt.currency.rates-updated.v1",
                "$JS.API.>", "$KV.BOOTSTRAP_CLAIMS.>"
              ],
              subscribe: ["_INBOX.>"]
            }
          },
          {
            user: "cartservice", password: $CARTSERVICE_PASSWORD,
            permissions: {
              publish: [
                "boutique.evt.cart.item-added.v1",
                "boutique.evt.cart.cleared.v1",
                "boutique.evt.cart.command-rejected.v1",
                "$JS.API.>", "$JS.ACK.>"
              ],
              subscribe: ["_INBOX.>", "boutique.cmd.cart.>", "boutique.evt.catalog.>"]
            }
          },
          {
            user: "recommendationservice", password: $RECOMMENDATIONSERVICE_PASSWORD,
            permissions: {
              publish: [
                "boutique.evt.recommendation.generated.v1", "$JS.API.>",
                "$JS.ACK.>", "$KV.RECOMMENDATION_CATALOG.>"
              ],
              subscribe: ["_INBOX.>", "boutique.evt.catalog.>", "boutique.evt.cart.>", "boutique.evt.storefront.page-viewed.v1"]
            }
          },
          {
            user: "adservice", password: $ADSERVICE_PASSWORD,
            permissions: {
              publish: ["boutique.evt.ad.selection-generated.v1", "$JS.API.>", "$JS.ACK.>"],
              subscribe: ["_INBOX.>", "boutique.evt.storefront.page-viewed.v1"]
            }
          },
          {
            user: "checkoutservice", password: $CHECKOUTSERVICE_PASSWORD,
            permissions: {
              publish: [
                "boutique.evt.order.submitted.v1",
                "boutique.evt.order.processing-stage-changed.v1",
                "boutique.evt.order.rejected.v1",
                "boutique.evt.order.completed.v1",
                "boutique.evt.order.cancelled.v1",
                "boutique.evt.order.manual-review-required.v1",
                "boutique.evt.order.step-timed-out.v1",
                "boutique.cmd.shipping.calculate-order-quote.v1",
                "boutique.cmd.shipping.create-shipment.v1",
                "boutique.cmd.shipping.cancel-shipment.v1",
                "boutique.cmd.payment.authorize.v1",
                "boutique.cmd.payment.capture.v1",
                "boutique.cmd.payment.release-authorization.v1",
                "boutique.cmd.cart.clear.v1", "$JS.API.>", "$JS.ACK.>"
              ],
              subscribe: ["_INBOX.>", "boutique.cmd.order.>", "boutique.evt.catalog.>", "boutique.evt.currency.>", "boutique.evt.cart.>", "boutique.evt.shipping.>", "boutique.evt.payment.>"]
            }
          },
          {
            user: "shippingservice", password: $SHIPPINGSERVICE_PASSWORD,
            permissions: {
              publish: [
                "boutique.evt.shipping.cart-quote-updated.v1",
                "boutique.evt.shipping.order-quote-calculated.v1",
                "boutique.evt.shipping.order-quote-failed.v1",
                "boutique.evt.shipping.shipment-created.v1",
                "boutique.evt.shipping.shipment-creation-failed.v1",
                "boutique.evt.shipping.shipment-cancelled.v1",
                "boutique.evt.shipping.shipment-cancellation-failed.v1",
                "$JS.API.>", "$JS.ACK.>"
              ],
              subscribe: ["_INBOX.>", "boutique.cmd.shipping.>", "boutique.evt.cart.>"]
            }
          },
          {
            user: "paymentservice", password: $PAYMENTSERVICE_PASSWORD,
            permissions: {
              publish: [
                "boutique.evt.payment.authorized.v1",
                "boutique.evt.payment.authorization-declined.v1",
                "boutique.evt.payment.captured.v1",
                "boutique.evt.payment.capture-failed.v1",
                "boutique.evt.payment.authorization-released.v1",
                "boutique.evt.payment.authorization-release-failed.v1",
                "_INBOX.>", "$JS.API.>", "$JS.ACK.>"
              ],
              subscribe: ["_INBOX.>", "$SRV.>", "boutique.cmd.payment.>", "boutique.qry.payment.tokenize.v1"]
            }
          },
          {
            user: "emailservice", password: $EMAILSERVICE_PASSWORD,
            permissions: {
              publish: [
                "boutique.evt.notification.order-confirmation-sent.v1",
                "boutique.evt.notification.order-confirmation-failed.v1",
                "$JS.API.>", "$JS.ACK.>"
              ],
              subscribe: ["_INBOX.>", "boutique.evt.order.completed.v1"]
            }
          },
          {
            user: "benchmarkservice", password: $BENCHMARKSERVICE_PASSWORD,
            permissions: {
              publish: [
                "$JS.API.>", "$JS.FC.>", "__NATS_BENCHMARK_RUNS_SUBJECT__",
                "__NATS_BENCHMARK_ARTIFACTS_SUBJECT__", "$SRV.STATS",
                "$SRV.STATS.>"
              ],
              subscribe: [
                "_INBOX.>", "__NATS_BENCHMARK_RUNS_SUBJECT__",
                "__NATS_BENCHMARK_ARTIFACTS_SUBJECT__",
                "boutique.evt.order.completed.v1"
              ]
            }
          },
          {
            user: "messageoperationsservice", password: $MESSAGEOPERATIONSSERVICE_PASSWORD,
            permissions: {
              publish: [
                "boutique.dlq.>", "boutique.cmd.>", "boutique.evt.>",
                "$JS.API.>", "$JS.ACK.>", "$KV.DLQ_CASES.>"
              ],
              subscribe: [
                "_INBOX.>", "$JS.EVENT.ADVISORY.CONSUMER.MAX_DELIVERIES.>",
                "$KV.DLQ_CASES.>"
              ]
            }
          }
        ]
      }
    }

    system_account: SYS
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/name: nats
  name: nats-server-config
  namespace: nats
---
apiVersion: v1
data:
  reconcile.sh: |
    #!/bin/sh
    set -u

    nats_namespace=nats
    workload_namespace=default
    nats_url=tls://nats.nats.svc.cluster.local:4222
    workdir=/tmp/nats-setup
    ready_file=${workdir}/ready
    interval=${RECONCILE_INTERVAL_SECONDS:-21600}
    token_file=/var/run/secrets/kubernetes.io/serviceaccount/token
    ca_file=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    api_host=${KUBERNETES_SERVICE_HOST:-kubernetes.default.svc}
    api_port=${KUBERNETES_SERVICE_PORT_HTTPS:-${KUBERNETES_SERVICE_PORT:-443}}
    token=$(tr -d '\n' < "${token_file}")
    services='frontend storefrontprojectionservice productcatalogservice currencyservice cartservice recommendationservice adservice checkoutservice shippingservice paymentservice emailservice benchmarkservice messageoperationsservice'

    log() {
      printf '%s %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$*"
    }

    fail() {
      log "ERROR: $*"
      return 1
    }

    b64_text() {
      printf '%s' "$1" | base64 | tr -d '\n'
    }

    b64_file() {
      base64 < "$1" | tr -d '\n'
    }

    random_secret() {
      value=$(openssl rand -hex 32) || return 1
      printf 's%s' "${value}"
    }

    # api_request talks to the Kubernetes API with the service-account CA.
    # BusyBox wget cannot use a custom CA bundle, so use the OpenSSL client
    # already provided by the public image. The API certificate is verified for
    # kubernetes.default.svc even when the service environment variable is an IP.
    api_request() {
      method=$1
      path=$2
      output=$3
      input=${4:-}
      content_type=${5:-application/json}
      raw=${workdir}/api-response.raw
      clean=${workdir}/api-response.clean
      error=${workdir}/api-response.error

      if [ -n "${input}" ]; then
        content_length=$(wc -c < "${input}" | tr -d ' ')
        {
          printf '%s\r\n' "${method} ${path} HTTP/1.1"
          printf '%s\r\n' "Host: ${api_host}"
          printf '%s\r\n' "Authorization: Bearer ${token}"
          printf '%s\r\n' 'Accept: application/json'
          printf '%s\r\n' "Content-Type: ${content_type}"
          printf '%s\r\n' "Content-Length: ${content_length}"
          printf '%s\r\n' 'Connection: close'
          printf '\r\n'
          cat "${input}"
        } | openssl s_client -quiet -verify_return_error \
          -CAfile "${ca_file}" -servername kubernetes.default.svc \
          -verify_hostname kubernetes.default.svc \
          -connect "${api_host}:${api_port}" > "${raw}" 2> "${error}"
      else
        {
          printf '%s\r\n' "${method} ${path} HTTP/1.1"
          printf '%s\r\n' "Host: ${api_host}"
          printf '%s\r\n' "Authorization: Bearer ${token}"
          printf '%s\r\n' 'Accept: application/json'
          printf '%s\r\n' 'Connection: close'
          printf '\r\n'
        } | openssl s_client -quiet -verify_return_error \
          -CAfile "${ca_file}" -servername kubernetes.default.svc \
          -verify_hostname kubernetes.default.svc \
          -connect "${api_host}:${api_port}" > "${raw}" 2> "${error}"
      fi

      tr -d '\r' < "${raw}" > "${clean}"
      status=$(sed -n '1s|HTTP/[0-9.]* \([0-9][0-9][0-9]\).*|\1|p' "${clean}")
      if [ -z "${status}" ]; then
        log "Kubernetes API ${method} ${path} returned no HTTP response: $(tr '\n' ' ' < "${error}")"
        return 1
      fi
      sed '1,/^$/d' "${clean}" > "${output}"
      printf '%s' "${status}"
    }

    # api_get returns 0 when a resource exists, 4 for a verified 404, and 1
    # for every other failure. This prevents a network or authorization error
    # from being mistaken for an absent Secret.
    api_get() {
      path=$1
      output=$2
      status=$(api_request GET "${path}" "${output}") || return 1
      case "${status}" in
        200) return 0 ;;
        404) return 4 ;;
        *) log "Kubernetes API GET ${path} returned HTTP ${status}"; return 1 ;;
      esac
    }

    # api_post returns 0 after creation, 9 when another actor won the
    # create-only race, and 1 for all other errors.
    api_post() {
      path=$1
      input=$2
      status=$(api_request POST "${path}" "${workdir}/post-response.json" "${input}") || return 1
      case "${status}" in
        200|201) return 0 ;;
        409) return 9 ;;
        *) log "Kubernetes API POST ${path} returned HTTP ${status}"; return 1 ;;
      esac
    }

    api_patch() {
      path=$1
      input=$2
      status=$(api_request PATCH "${path}" "${workdir}/patch-response.json" "${input}" 'application/merge-patch+json') || return 1
      case "${status}" in
        200) return 0 ;;
        *) log "Kubernetes API PATCH ${path} returned HTTP ${status}"; return 1 ;;
      esac
    }

    ensure_from_file() {
      resource=$1
      namespace=$2
      name=$3
      input=$4
      get_path=/api/v1/namespaces/${namespace}/${resource}/${name}
      post_path=/api/v1/namespaces/${namespace}/${resource}

      api_get "${get_path}" "${workdir}/existing.json"
      status=$?
      if [ "${status}" -eq 0 ]; then
        log "preserving existing ${resource} ${namespace}/${name}"
        return 0
      fi
      if [ "${status}" -ne 4 ]; then
        return 1
      fi

      api_post "${post_path}" "${input}"
      status=$?
      if [ "${status}" -eq 0 ]; then
        log "created ${resource} ${namespace}/${name}"
        return 0
      fi
      if [ "${status}" -eq 9 ]; then
        log "preserving concurrently created ${resource} ${namespace}/${name}"
        return 0
      fi
      return 1
    }

    # Client resources are projections of the create-only broker Secrets. They
    # must be synchronized if the nats namespace is recreated independently of
    # the application namespace; preserving stale values makes every workload
    # fail TLS verification and authentication.
    sync_from_file() {
      resource=$1
      namespace=$2
      name=$3
      input=$4
      get_path=/api/v1/namespaces/${namespace}/${resource}/${name}
      post_path=/api/v1/namespaces/${namespace}/${resource}

      api_get "${get_path}" "${workdir}/existing.json"
      status=$?
      if [ "${status}" -eq 0 ]; then
        api_patch "${get_path}" "${input}" || return 1
        log "synchronized existing ${resource} ${namespace}/${name}"
        return 0
      fi
      if [ "${status}" -ne 4 ]; then
        return 1
      fi

      api_post "${post_path}" "${input}"
      status=$?
      if [ "${status}" -eq 0 ]; then
        log "created ${resource} ${namespace}/${name}"
        return 0
      fi
      if [ "${status}" -eq 9 ]; then
        api_patch "${get_path}" "${input}" || return 1
        log "synchronized concurrently created ${resource} ${namespace}/${name}"
        return 0
      fi
      return 1
    }

    secret_data() {
      namespace=$1
      name=$2
      key=$3
      if ! api_get "/api/v1/namespaces/${namespace}/secrets/${name}" "${workdir}/${namespace}-${name}.json"; then
        return 1
      fi
      value=$(tr -d '\n' < "${workdir}/${namespace}-${name}.json" | sed -n "s/.*\"${key}\":\"\\([^\"]*\\)\".*/\\1/p")
      if [ -z "${value}" ]; then
        fail "Secret ${namespace}/${name} is missing required key ${key}; refusing to change it"
        return 1
      fi
      printf '%s' "${value}"
    }

    write_auth_secret() {
      output=$1
      {
        printf '%s' '{"apiVersion":"v1","kind":"Secret","metadata":{"name":"nats-server-auth","namespace":"nats","labels":{"app.kubernetes.io/name":"nats","app.kubernetes.io/component":"setup","app.kubernetes.io/part-of":"online-boutique"}},"type":"Opaque","data":{'
        first=true
        for key in JETSTREAM_ENCRYPTION_KEY SYS_PASSWORD ADMIN_PASSWORD; do
          value=$(random_secret) || return 1
          if [ "${first}" = true ]; then first=false; else printf ','; fi
          printf '"%s":"%s"' "${key}" "$(b64_text "${value}")"
        done
        for service in ${services}; do
          value=$(random_secret) || return 1
          key=$(printf '%s' "${service}" | tr '[:lower:]' '[:upper:]')_PASSWORD
          printf ',"%s":"%s"' "${key}" "$(b64_text "${value}")"
        done
        printf '%s\n' '}}'
      } > "${output}"
    }

    write_tls_secret() {
      output=$1
      umask 077
      openssl req -x509 -newkey rsa:3072 -nodes -sha256 -days 3650 \
        -subj '/CN=Online Boutique NATS CA' \
        -keyout "${workdir}/ca.key" -out "${workdir}/ca.crt" >/dev/null 2>&1 || return 1
      cat > "${workdir}/server.ext" <<'EOF'
    basicConstraints=critical,CA:FALSE
    keyUsage=critical,digitalSignature,keyEncipherment
    extendedKeyUsage=serverAuth,clientAuth
    subjectAltName=DNS:nats,DNS:nats.nats,DNS:nats.nats.svc,DNS:nats.nats.svc.cluster.local,DNS:nats-headless,DNS:nats-headless.nats.svc.cluster.local,DNS:*.nats-headless.nats.svc.cluster.local
    EOF
      openssl req -newkey rsa:3072 -nodes -sha256 \
        -subj '/CN=nats.nats.svc.cluster.local' \
        -keyout "${workdir}/tls.key" -out "${workdir}/tls.csr" >/dev/null 2>&1 || return 1
      openssl x509 -req -sha256 -days 1095 \
        -in "${workdir}/tls.csr" -CA "${workdir}/ca.crt" -CAkey "${workdir}/ca.key" -CAcreateserial \
        -extfile "${workdir}/server.ext" -out "${workdir}/tls.crt" >/dev/null 2>&1 || return 1
      printf '%s\n' "{\"apiVersion\":\"v1\",\"kind\":\"Secret\",\"metadata\":{\"name\":\"nats-server-tls\",\"namespace\":\"nats\",\"labels\":{\"app.kubernetes.io/name\":\"nats\",\"app.kubernetes.io/component\":\"setup\",\"app.kubernetes.io/part-of\":\"online-boutique\"}},\"type\":\"Opaque\",\"data\":{\"ca.crt\":\"$(b64_file "${workdir}/ca.crt")\",\"tls.crt\":\"$(b64_file "${workdir}/tls.crt")\",\"tls.key\":\"$(b64_file "${workdir}/tls.key")\"}}" > "${output}"
    }

    write_gateway_tls_secret() {
      output=$1
      gateway_dns_names=${NATS_GATEWAY_DNS_NAMES:-}
      if [ -z "${gateway_dns_names}" ]; then
        fail 'NATS_GATEWAY_DNS_NAMES is required to create standalone gateway PKI'
        return 1
      fi
      case "${gateway_dns_names}" in
        *[!A-Za-z0-9.,*-]*) fail 'NATS_GATEWAY_DNS_NAMES contains unsafe characters'; return 1 ;;
      esac
      gateway_sans=$(printf '%s' "${gateway_dns_names}" | sed 's/^/DNS:/; s/,/,DNS:/g')
      first_gateway_dns=${gateway_dns_names%%,*}
      umask 077
      openssl req -x509 -newkey rsa:3072 -nodes -sha256 -days 3650 \
        -subj '/CN=Online Boutique NATS Gateway CA' \
        -keyout "${workdir}/gateway-ca.key" -out "${workdir}/gateway-ca.crt" >/dev/null 2>&1 || return 1
      {
        printf '%s\n' 'basicConstraints=critical,CA:FALSE'
        printf '%s\n' 'keyUsage=critical,digitalSignature,keyEncipherment'
        printf '%s\n' 'extendedKeyUsage=serverAuth,clientAuth'
        printf 'subjectAltName=%s\n' "${gateway_sans}"
      } > "${workdir}/gateway-server.ext"
      openssl req -newkey rsa:3072 -nodes -sha256 \
        -subj "/CN=${first_gateway_dns}" \
        -keyout "${workdir}/gateway-tls.key" -out "${workdir}/gateway-tls.csr" >/dev/null 2>&1 || return 1
      openssl x509 -req -sha256 -days 825 \
        -in "${workdir}/gateway-tls.csr" -CA "${workdir}/gateway-ca.crt" \
        -CAkey "${workdir}/gateway-ca.key" -CAcreateserial \
        -extfile "${workdir}/gateway-server.ext" -out "${workdir}/gateway-tls.crt" >/dev/null 2>&1 || return 1
      printf '%s\n' "{\"apiVersion\":\"v1\",\"kind\":\"Secret\",\"metadata\":{\"name\":\"nats-gateway-tls\",\"namespace\":\"nats\",\"labels\":{\"app.kubernetes.io/name\":\"nats\",\"app.kubernetes.io/component\":\"gateway-pki\",\"app.kubernetes.io/part-of\":\"online-boutique\"}},\"type\":\"Opaque\",\"data\":{\"ca.crt\":\"$(b64_file "${workdir}/gateway-ca.crt")\",\"tls.crt\":\"$(b64_file "${workdir}/gateway-tls.crt")\",\"tls.key\":\"$(b64_file "${workdir}/gateway-tls.key")\"}}" > "${output}"
    }

    write_global_application_secret() {
      output=$1
      frontend_cookie_key=$(random_secret) || return 1
      payment_signing_key=$(random_secret) || return 1
      shipping_provider_secret=$(random_secret) || return 1
      printf '%s\n' "{\"apiVersion\":\"v1\",\"kind\":\"Secret\",\"metadata\":{\"name\":\"global-application-secrets\",\"namespace\":\"default\",\"labels\":{\"app.kubernetes.io/name\":\"global-application-secrets\",\"app.kubernetes.io/component\":\"business-keys\",\"app.kubernetes.io/part-of\":\"online-boutique\"}},\"type\":\"Opaque\",\"data\":{\"FRONTEND_COOKIE_KEY\":\"$(b64_text "${frontend_cookie_key}")\",\"PAYMENT_SIGNING_KEY\":\"$(b64_text "${payment_signing_key}")\",\"PAYMENT_VERIFICATION_KEYS\":\"$(b64_text '{}')\",\"SHIPPING_PROVIDER_SECRET\":\"$(b64_text "${shipping_provider_secret}")\"}}" > "${output}"
    }

    secret_fingerprint() {
      namespace=$1
      name=$2
      key=$3
      encoded=$(secret_data "${namespace}" "${name}" "${key}") || return 1
      printf '%s' "${encoded}" | base64 -d | openssl dgst -sha256 | sed 's/^.*= //; s/^\(.\{16\}\).*$/\1/'
    }

    pem_json() {
      base64 -d | awk '{gsub(/\\/, "\\\\"); gsub(/"/, "\\\""); printf "%s\\n", $0}'
    }

    write_ca_configmap() {
      namespace=$1
      output=$2
      ca_encoded=$(secret_data nats nats-server-tls ca.crt) || return 1
      ca=$(printf '%s' "${ca_encoded}" | pem_json) || return 1
      printf '%s\n' "{\"apiVersion\":\"v1\",\"kind\":\"ConfigMap\",\"metadata\":{\"name\":\"nats-ca\",\"namespace\":\"${namespace}\",\"labels\":{\"app.kubernetes.io/name\":\"nats\",\"app.kubernetes.io/component\":\"setup\",\"app.kubernetes.io/part-of\":\"online-boutique\"}},\"data\":{\"ca.crt\":\"${ca}\"}}" > "${output}"
    }

    write_credentials_secret() {
      namespace=$1
      name=$2
      user=$3
      password=$4
      output=$5
      printf '%s\n' "{\"apiVersion\":\"v1\",\"kind\":\"Secret\",\"metadata\":{\"name\":\"${name}\",\"namespace\":\"${namespace}\",\"labels\":{\"app.kubernetes.io/name\":\"nats\",\"app.kubernetes.io/component\":\"setup\",\"app.kubernetes.io/part-of\":\"online-boutique\"}},\"type\":\"Opaque\",\"data\":{\"NATS_URL\":\"$(b64_text "${nats_url}")\",\"NATS_USER\":\"$(b64_text "${user}")\",\"NATS_PASSWORD\":\"${password}\"}}" > "${output}"
    }

    write_messageoperations_admin_secret() {
      output=$1
      admin_api_token=$(random_secret) || return 1
      printf '%s\n' "{\"apiVersion\":\"v1\",\"kind\":\"Secret\",\"metadata\":{\"name\":\"messageoperations-admin-api\",\"namespace\":\"default\",\"labels\":{\"app.kubernetes.io/name\":\"messageoperationsservice\",\"app.kubernetes.io/component\":\"admin-api\",\"app.kubernetes.io/part-of\":\"online-boutique\"}},\"type\":\"Opaque\",\"data\":{\"ADMIN_USER\":\"$(b64_text admin)\",\"ADMIN_API_TOKEN\":\"$(b64_text "${admin_api_token}")\"}}" > "${output}"
    }

    reconcile() {
      write_auth_secret "${workdir}/auth.json" || return 1
      ensure_from_file secrets nats nats-server-auth "${workdir}/auth.json" || return 1
      for key in JETSTREAM_ENCRYPTION_KEY SYS_PASSWORD ADMIN_PASSWORD; do
        secret_data nats nats-server-auth "${key}" >/dev/null || return 1
      done
      for service in ${services}; do
        key=$(printf '%s' "${service}" | tr '[:lower:]' '[:upper:]')_PASSWORD
        secret_data nats nats-server-auth "${key}" >/dev/null || return 1
      done

      write_tls_secret "${workdir}/tls.json" || return 1
      ensure_from_file secrets nats nats-server-tls "${workdir}/tls.json" || return 1
      for key in ca.crt tls.crt tls.key; do
        secret_data nats nats-server-tls "${key}" >/dev/null || return 1
      done

      api_get /api/v1/namespaces/nats/secrets/nats-gateway-tls "${workdir}/existing-gateway-tls.json"
      gateway_status=$?
      if [ "${gateway_status}" -eq 4 ]; then
        if [ "${NATS_SUPERCLUSTER_ENABLED}" = true ]; then
          fail 'supercluster mode requires a pre-provisioned shared-trust nats-gateway-tls Secret'
          return 1
        fi
        write_gateway_tls_secret "${workdir}/gateway-tls.json" || return 1
        ensure_from_file secrets nats nats-gateway-tls "${workdir}/gateway-tls.json" || return 1
      elif [ "${gateway_status}" -ne 0 ]; then
        return 1
      else
        log 'preserving existing secrets nats/nats-gateway-tls'
      fi
      for key in ca.crt tls.crt tls.key; do
        secret_data nats nats-gateway-tls "${key}" >/dev/null || return 1
      done

      api_get /api/v1/namespaces/default/secrets/global-application-secrets "${workdir}/existing-global-application.json"
      global_status=$?
      if [ "${global_status}" -eq 4 ] && [ "${NATS_CLUSTER_ROLE}" = secondary ]; then
        fail 'secondary cluster requires a pre-provisioned global-application-secrets Secret'
        return 1
      elif [ "${global_status}" -ne 0 ] && [ "${global_status}" -ne 4 ]; then
        return 1
      fi
      write_global_application_secret "${workdir}/global-application.json" || return 1
      ensure_from_file secrets default global-application-secrets "${workdir}/global-application.json" || return 1
      for key in FRONTEND_COOKIE_KEY PAYMENT_SIGNING_KEY PAYMENT_VERIFICATION_KEYS SHIPPING_PROVIDER_SECRET; do
        secret_data default global-application-secrets "${key}" >/dev/null || return 1
      done

      for namespace in nats default; do
        write_ca_configmap "${namespace}" "${workdir}/${namespace}-ca.json" || return 1
        sync_from_file configmaps "${namespace}" nats-ca "${workdir}/${namespace}-ca.json" || return 1
      done

      admin_password=$(secret_data nats nats-server-auth ADMIN_PASSWORD) || return 1
      write_credentials_secret nats nats-admin-credentials admin "${admin_password}" "${workdir}/admin.json" || return 1
      sync_from_file secrets nats nats-admin-credentials "${workdir}/admin.json" || return 1

      for service in ${services}; do
        key=$(printf '%s' "${service}" | tr '[:lower:]' '[:upper:]')_PASSWORD
        password=$(secret_data nats nats-server-auth "${key}") || return 1
        write_credentials_secret default "nats-credentials-${service}" "${service}" "${password}" "${workdir}/credential-${service}.json" || return 1
        sync_from_file secrets default "nats-credentials-${service}" "${workdir}/credential-${service}.json" || return 1
      done

      operations_password=$(secret_data nats nats-server-auth MESSAGEOPERATIONSSERVICE_PASSWORD) || return 1
      write_credentials_secret nats nats-messageoperations-credentials messageoperationsservice "${operations_password}" "${workdir}/operations.json" || return 1
      sync_from_file secrets nats nats-messageoperations-credentials "${workdir}/operations.json" || return 1

      write_messageoperations_admin_secret "${workdir}/messageoperations-admin.json" || return 1
      ensure_from_file secrets default messageoperations-admin-api "${workdir}/messageoperations-admin.json" || return 1
      secret_data default messageoperations-admin-api ADMIN_USER >/dev/null || return 1
      secret_data default messageoperations-admin-api ADMIN_API_TOKEN >/dev/null || return 1

      log "global key fingerprints frontend_cookie=$(secret_fingerprint default global-application-secrets FRONTEND_COOKIE_KEY) payment=$(secret_fingerprint default global-application-secrets PAYMENT_SIGNING_KEY) shipping=$(secret_fingerprint default global-application-secrets SHIPPING_PROVIDER_SECRET) gateway_ca=$(secret_fingerprint nats nats-gateway-tls ca.crt)"
    }

    mkdir -p "${workdir}" || exit 1
    chmod 700 "${workdir}" || exit 1
    while true; do
      rm -f "${ready_file}"
      if reconcile; then
        touch "${ready_file}"
        log 'NATS setup is reconciled; broker Secrets were preserved and client resources synchronized'
      else
        log 'NATS setup reconciliation failed; retrying in 10 seconds'
        sleep 10
        continue
      fi
      sleep "${interval}"
    done
