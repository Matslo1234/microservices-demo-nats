apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app.kubernetes.io/name: nats
    app.kubernetes.io/part-of: online-boutique
  name: nats
  namespace: nats
spec:
  podManagementPolicy: Parallel
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: nats
  serviceName: nats-headless
  template:
    metadata:
      annotations:
        prometheus.io/path: /metrics
        prometheus.io/port: "7777"
        prometheus.io/scrape: "true"
      labels:
        app.kubernetes.io/name: nats
        app.kubernetes.io/part-of: online-boutique
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - preference:
              matchExpressions:
              - key: eks.amazonaws.com/nodegroup
                operator: In
                values:
                - nats-group
            weight: 100
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: nats
            topologyKey: kubernetes.io/hostname
      containers:
      - args:
        - |
          export NATS_SERVER_NAME="${REGION_ID}-${POD_NAME}"
          export NATS_NODE_TAG="node:${NODE_NAME}"
          case "${POD_NAME}" in
            nats-0) NATS_GATEWAY_ADVERTISE="${NATS_GATEWAY_ADVERTISE_0:-${POD_NAME}.${NATS_GATEWAY_DOMAIN}:7222}" ;;
            nats-1) NATS_GATEWAY_ADVERTISE="${NATS_GATEWAY_ADVERTISE_1:-${POD_NAME}.${NATS_GATEWAY_DOMAIN}:7222}" ;;
            nats-2) NATS_GATEWAY_ADVERTISE="${NATS_GATEWAY_ADVERTISE_2:-${POD_NAME}.${NATS_GATEWAY_DOMAIN}:7222}" ;;
            *) echo "unexpected NATS pod name ${POD_NAME}" >&2; exit 1 ;;
          esac
          export NATS_GATEWAY_ADVERTISE
          sed \
            -e "s|__NATS_FRONTEND_LIVE_SUBJECT__|${NATS_FRONTEND_LIVE_SUBJECT}|g" \
            -e "s|__NATS_PROJECTION_PRODUCTS_SUBJECT__|${NATS_PROJECTION_PRODUCTS_SUBJECT}|g" \
            -e "s|__NATS_PROJECTION_CARTS_SUBJECT__|${NATS_PROJECTION_CARTS_SUBJECT}|g" \
            -e "s|__NATS_PROJECTION_CONTEXT_SUBJECT__|${NATS_PROJECTION_CONTEXT_SUBJECT}|g" \
            -e "s|__NATS_PROJECTION_ORDERS_SUBJECT__|${NATS_PROJECTION_ORDERS_SUBJECT}|g" \
            -e "s|__NATS_PROJECTION_OPERATIONS_SUBJECT__|${NATS_PROJECTION_OPERATIONS_SUBJECT}|g" \
            -e "s|__NATS_BENCHMARK_RUNS_SUBJECT__|${NATS_BENCHMARK_RUNS_SUBJECT}|g" \
            -e "s|__NATS_BENCHMARK_ARTIFACTS_SUBJECT__|${NATS_BENCHMARK_ARTIFACTS_SUBJECT}|g" \
            -e "s|__NATS_CLUSTER_ROUTES__|${NATS_CLUSTER_ROUTES}|g" \
            /etc/nats-config/nats.conf > /var/run/nats/nats.conf
          sed -e "s|__NATS_CLUSTER_ROUTES__|${NATS_CLUSTER_ROUTES}|g" \
            /etc/nats-config/cluster.conf > /var/run/nats/cluster.conf
          cp /etc/nats-config/gateway.conf /var/run/nats/gateway.conf
          exec nats-server -c /var/run/nats/nats.conf
        command:
        - /bin/sh
        - -ec
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        envFrom:
        - configMapRef:
            name: nats-region-config
        - secretRef:
            name: nats-server-auth
        image: nats:2.14.3-alpine
        imagePullPolicy: IfNotPresent
        lifecycle:
          preStop:
            exec:
              command:
              - nats-server
              - -sl
              - ldm=/var/run/nats/nats.pid
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz?js-server-only=true
            port: monitor
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 2
        name: nats
        ports:
        - containerPort: 4222
          name: client
        - containerPort: 6222
          name: cluster
        - containerPort: 7222
          name: gateway
        - containerPort: 8222
          name: monitor
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz?js-enabled-only=true
            port: monitor
          periodSeconds: 5
          timeoutSeconds: 2
        resources:
          limits:
            cpu: "2"
            memory: 4Gi
          requests:
            cpu: 500m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        startupProbe:
          failureThreshold: 60
          httpGet:
            path: /healthz?js-enabled-only=true
            port: monitor
          periodSeconds: 2
        volumeMounts:
        - mountPath: /etc/nats-config
          name: config
          readOnly: true
        - mountPath: /etc/nats/tls
          name: tls
          readOnly: true
        - mountPath: /etc/nats/gateway-tls
          name: gateway-tls
          readOnly: true
        - mountPath: /data
          name: jetstream
        - mountPath: /var/run/nats
          name: run
      - args:
        - -p
        - "7777"
        - -varz
        - -routez
        - -gatewayz
        - -subz
        - -jsz=all
        - http://127.0.0.1:8222
        image: natsio/prometheus-nats-exporter:0.20.1
        imagePullPolicy: IfNotPresent
        name: metrics
        ports:
        - containerPort: 7777
          name: metrics
        resources:
          limits:
            cpu: 250m
            memory: 512Mi
          requests:
            cpu: 50m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
      initContainers:
      - command:
        - sh
        - -ec
        - chown 1000:1000 /data
        image: busybox:1.37.0
        name: volume-permissions
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add:
            - CHOWN
            drop:
            - ALL
          runAsNonRoot: false
          runAsUser: 0
        volumeMounts:
        - mountPath: /data
          name: jetstream
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: nats
      terminationGracePeriodSeconds: 60
      tolerations:
      - effect: NoSchedule
        key: dedicated
        operator: Equal
        value: nats
      topologySpreadConstraints:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: nats
        maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
      volumes:
      - name: config
        projected:
          sources:
          - configMap:
              name: nats-server-config
          - configMap:
              name: nats-gateway-config
      - name: tls
        secret:
          secretName: nats-server-tls
      - name: gateway-tls
        secret:
          optional: true
          secretName: nats-gateway-tls
      - emptyDir: {}
        name: run
  updateStrategy:
    type: RollingUpdate
  volumeClaimTemplates:
  - metadata:
      labels:
        app.kubernetes.io/component: jetstream
        app.kubernetes.io/name: nats
      name: jetstream
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 20Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app.kubernetes.io/component: backup
    app.kubernetes.io/name: nats
  name: nats-backup
  namespace: nats
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        metadata:
          labels:
            app.kubernetes.io/name: nats-backup
            app.kubernetes.io/part-of: online-boutique
        spec:
          containers:
          - command:
            - sh
            - -ec
            - |
              destination="/backups/$(date -u +%Y%m%dT%H%M%SZ)"
              nats --server="${NATS_URL}" --user="${NATS_USER}" --password="${NATS_PASSWORD}" \
                --tlsca=/etc/nats-ca/ca.crt account backup "${destination}" \
                --consumers --check --critical-warnings --force
              find /backups -mindepth 1 -maxdepth 1 -type d -mtime +14 -exec rm -rf {} +
            envFrom:
            - secretRef:
                name: nats-admin-credentials
            image: natsio/nats-box:0.19.7-nonroot
            name: backup
            resources:
              limits:
                cpu: 200m
                memory: 256Mi
              requests:
                cpu: 20m
                memory: 32Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
            volumeMounts:
            - mountPath: /backups
              name: backups
            - mountPath: /etc/nats-ca
              name: ca
              readOnly: true
          initContainers:
          - command:
            - sh
            - -ec
            - chown 1000:1000 /backups
            image: busybox:1.37.0
            name: volume-permissions
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                add:
                - CHOWN
                drop:
                - ALL
              runAsNonRoot: false
              runAsUser: 0
            volumeMounts:
            - mountPath: /backups
              name: backups
          restartPolicy: OnFailure
          securityContext:
            fsGroup: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          volumes:
          - name: backups
            persistentVolumeClaim:
              claimName: nats-backups
          - configMap:
              name: nats-ca
            name: ca
  schedule: 17 2 * * *
  successfulJobsHistoryLimit: 3
  timeZone: Etc/UTC
