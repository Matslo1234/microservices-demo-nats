apiVersion: v1
data:
  bootstrap.sh: |
    #!/bin/sh
    set -eu

    node() {
      ordinal="$1"
      printf '%s-%s.%s.%s.svc.cluster.local' \
        "${CLUSTER_NAME}" "${ordinal}" "${HEADLESS_SERVICE}" "${POD_NAMESPACE}"
    }

    ordinal=0
    while [ "${ordinal}" -lt 6 ]; do
      host="$(node "${ordinal}")"
      until redis-cli -h "${host}" -p 6379 PING >/dev/null 2>&1; do
        echo "waiting for ${host}"
        sleep 2
      done
      ordinal=$((ordinal + 1))
    done

    seed="$(node 0)"
    if redis-cli -h "${seed}" -p 6379 CLUSTER INFO 2>/dev/null |
      grep -q '^cluster_state:ok'; then
      echo "${CLUSTER_NAME} is already healthy"
      exit 0
    fi

    known_nodes="$(redis-cli -h "${seed}" -p 6379 CLUSTER INFO 2>/dev/null |
      sed -n 's/^cluster_known_nodes:\([0-9][0-9]*\).*/\1/p')"
    if [ "${known_nodes:-1}" -gt 1 ]; then
      echo "${CLUSTER_NAME} was already created and is converging"
    else
      redis-cli --cluster create \
        "$(node 0):6379" "$(node 1):6379" "$(node 2):6379" \
        "$(node 3):6379" "$(node 4):6379" "$(node 5):6379" \
        --cluster-replicas 1 --cluster-yes
    fi

    attempts=0
    until redis-cli -h "${seed}" -p 6379 CLUSTER INFO 2>/dev/null |
      grep -q '^cluster_state:ok'; do
      attempts=$((attempts + 1))
      if [ "${attempts}" -ge 60 ]; then
        echo "${CLUSTER_NAME} did not become healthy" >&2
        exit 1
      fi
      sleep 2
    done
    redis-cli -h "${seed}" -p 6379 CLUSTER INFO
  repair-topology.sh: |
    #!/bin/sh
    set -eu

    topology=/data/nodes.conf
    if [ ! -s "${topology}" ]; then
      echo "no persisted Redis Cluster topology to repair"
      exit 0
    fi

    repaired="${topology}.repaired"
    : >"${repaired}"
    while IFS= read -r line || [ -n "${line}" ]; do
      case "${line}" in
        vars\ *)
          printf '%s\n' "${line}" >>"${repaired}"
          continue
          ;;
      esac

      set -- ${line}
      endpoint="${2:-}"
      metadata="${endpoint#*,}"
      if [ -z "${endpoint}" ] || [ "${metadata}" = "${endpoint}" ]; then
        printf '%s\n' "${line}" >>"${repaired}"
        continue
      fi

      hostname="${metadata%%,*}"
      if [ -z "${hostname}" ]; then
        # A peer which stopped before persisting its announced hostname can
        # leave an empty metadata field. Keep its last address; Redis will
        # relearn the peer through cluster gossip after this node starts.
        printf '%s\n' "${line}" >>"${repaired}"
        continue
      fi
      attempts=0
      address=""
      until [ -n "${address}" ]; do
        address="$(
          getent hosts "${hostname}" 2>/dev/null |
            awk 'NR == 1 { print $1 }'
        )"
        attempts=$((attempts + 1))
        if [ -z "${address}" ]; then
          if [ "${attempts}" -ge 60 ]; then
            echo "could not resolve Redis Cluster peer ${hostname}" >&2
            exit 1
          fi
          sleep 1
        fi
      done

      suffix=",${metadata}"
      replacement="${address}:6379@16379${suffix}"
      printf '%s\n' "${line}" |
        awk -v endpoint="${replacement}" '{$2 = endpoint; print}' \
          >>"${repaired}"
    done <"${topology}"

    chmod 600 "${repaired}"
    mv "${repaired}" "${topology}"
    echo "refreshed persisted Redis Cluster peer addresses from stable DNS names"
