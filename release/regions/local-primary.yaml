            {"expr": "sum by (gateway_name, remote_gateway_name) (rate(gnatsd_gatewayz_outbound_gateway_conn_out_bytes[5m]))", "legendFormat": "{{gateway_name}} to {{remote_gateway_name}}", "refId": "A"},
            {"expr": "sum by (gateway_name, remote_gateway_name) (rate(gnatsd_gatewayz_inbound_gateway_conn_in_bytes[5m]))", "legendFormat": "{{remote_gateway_name}} to {{gateway_name}}", "refId": "B"}
