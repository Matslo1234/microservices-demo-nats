  bootstrap.sh: |
    #!/bin/sh
    set -eu

    if [ "${NATS_CLUSTER_ROLE}" != primary ]; then
      echo "global bootstrap refuses NATS_CLUSTER_ROLE=${NATS_CLUSTER_ROLE}" >&2
      exit 1
    fi
    if [ "${NATS_CLUSTERED}" = true ] && [ "${GLOBAL_ASSET_CLUSTER}" != "${NATS_CLUSTER_NAME}" ]; then
      echo "global assets must be bootstrapped from their owner cluster" >&2
      exit 1
    fi

    nats_args="--server=${NATS_URL} --user=${NATS_USER} --password=${NATS_PASSWORD} --tlsca=/etc/nats-ca/ca.crt"
    placement_args=""
    if [ "${NATS_CLUSTERED}" = true ]; then
      placement_args="--cluster=${GLOBAL_ASSET_CLUSTER}"
    fi
    until nats ${nats_args} account info >/dev/null 2>&1; do
      echo "waiting for the NATS JetStream account"
      sleep 2
    done

    for source in /config/streams/*.json; do
      target="/work/$(basename "${source}")"
      sed \
        -e "s/__GLOBAL_ASSET_CLUSTER__/${GLOBAL_ASSET_CLUSTER}/g" \
        -e "s/__NATS_JETSTREAM_REPLICAS__/${NATS_JETSTREAM_REPLICAS}/g" \
        "${source}" > "${target}"
      if [ "${NATS_CLUSTERED}" != true ]; then
        sed -i -e '/"placement": {"cluster":/d' -e '/"allow_direct":/s/,$//' "${target}"
      fi
      stream_name="$(basename "${source}" .json)"
      if nats ${nats_args} stream info "${stream_name}" >/dev/null 2>&1; then
        nats ${nats_args} stream update "${stream_name}" --config "${target}" --force
      else
        nats ${nats_args} stream add --config "${target}"
      fi
      compact="$(nats ${nats_args} stream info "${stream_name}" --json | tr -d '[:space:]')"
      if [ "${NATS_CLUSTERED}" = true ]; then
        printf '%s' "${compact}" | grep -F "\"cluster\":\"${GLOBAL_ASSET_CLUSTER}\"" >/dev/null || {
        echo "stream ${stream_name} is not placed in ${GLOBAL_ASSET_CLUSTER}" >&2
        exit 1
        }
      fi
    done

    assert_backing_stream() {
      stream=$1
      history=$2
      max_age=$3
      max_bytes=$4
      cluster=$5
      compact="$(nats ${nats_args} stream info "${stream}" --json | tr -d '[:space:]')"
      for expected in \
        "\"num_replicas\":${NATS_JETSTREAM_REPLICAS}" \
        "\"storage\":\"file\"" \
        "\"max_msgs_per_subject\":${history}" \
        "\"max_age\":${max_age}" \
        "\"max_bytes\":${max_bytes}"; do
        printf '%s' "${compact}" | grep -F "${expected}" >/dev/null || {
          echo "${stream} does not match ${expected}" >&2
          exit 1
        }
      done
      if [ "${NATS_CLUSTERED}" = true ]; then
        printf '%s' "${compact}" | grep -F "\"cluster\":\"${cluster}\"" >/dev/null || exit 1
      fi
    }

    ensure_kv() {
      bucket=$1
      history=$2
      ttl=$3
      max_age=$4
      max_bytes=$5
      cluster=$6
      if nats ${nats_args} kv info "${bucket}" >/dev/null 2>&1; then
        nats ${nats_args} kv edit "${bucket}" --history="${history}" --replicas="${NATS_JETSTREAM_REPLICAS}" \
          --ttl="${ttl}" --max-bucket-size="${max_bytes}" ${placement_args}
      else
        nats ${nats_args} kv add "${bucket}" --history="${history}" --replicas="${NATS_JETSTREAM_REPLICAS}" \
          --storage=file --ttl="${ttl}" --max-bucket-size="${max_bytes}" ${placement_args}
      fi
      assert_backing_stream "KV_${bucket}" "${history}" "${max_age}" "${max_bytes}" "${cluster}"
    }

    ensure_kv RECOMMENDATION_CATALOG 5 0s 0 268435456 "${GLOBAL_ASSET_CLUSTER}"
    ensure_kv BOOTSTRAP_CLAIMS 5 0s 0 67108864 "${GLOBAL_ASSET_CLUSTER}"
    ensure_kv DLQ_CASES 10 2160h 7776000000000000 268435456 "${GLOBAL_ASSET_CLUSTER}"
    nats ${nats_args} stream list
    nats ${nats_args} kv list
