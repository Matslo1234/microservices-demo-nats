apiVersion: 1
prune: true
datasources:
- name: Prometheus
  uid: prometheus
  type: prometheus
  access: proxy
  url: http://prometheus.observability.svc.cluster.local:9090
  isDefault: true
  editable: false
  jsonData:
    httpMethod: POST
    timeInterval: 15s
- name: Loki
  uid: loki
  type: loki
  access: proxy
  url: http://loki.observability.svc.cluster.local:3100
  editable: false
  jsonData:
    maxLines: 2000
- name: Tempo
  uid: tempo
  type: tempo
  access: proxy
  url: http://tempo.observability.svc.cluster.local:3200
  editable: false
  jsonData:
    tracesToLogsV2:
      datasourceUid: loki
      filterByTraceID: true
      filterBySpanID: true
    serviceMap:
      datasourceUid: prometheus
    nodeGraph:
      enabled: true
