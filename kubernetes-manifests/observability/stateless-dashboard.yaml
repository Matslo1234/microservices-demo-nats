apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-stateless-dashboard
  namespace: observability
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: online-boutique-observability
data:
  stateless-handlers.json: |
    {
      "annotations": {"list": []},
      "description": "Stateless handler outcomes, aggregate contention, redelivery, distributed claims, and JetStream consumer lag.",
      "editable": false,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "ops"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "id": 1,
          "options": {
            "legend": {"calcs": ["lastNotNull"], "displayMode": "table", "placement": "bottom", "showLegend": true},
            "tooltip": {"mode": "multi", "sort": "desc"}
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum by (service, handler, outcome) (rate(boutique_handler_outcomes_total{namespace=~\"$namespace\",service=~\"$service\"}[5m]))",
              "legendFormat": "{{service}} / {{handler}} / {{outcome}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Handler outcomes",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "ops"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "id": 2,
          "options": {
            "legend": {"calcs": ["lastNotNull"], "displayMode": "table", "placement": "bottom", "showLegend": true},
            "tooltip": {"mode": "multi", "sort": "desc"}
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum by (service, aggregate_type) (rate(boutique_state_conflicts_total{namespace=~\"$namespace\",service=~\"$service\"}[5m]))",
              "legendFormat": "{{service}} / {{aggregate_type}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Aggregate conflicts",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "ops"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "id": 3,
          "options": {
            "legend": {"calcs": ["lastNotNull"], "displayMode": "table", "placement": "bottom", "showLegend": true},
            "tooltip": {"mode": "multi", "sort": "desc"}
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum by (service, handler) (rate(boutique_handler_redeliveries_total{namespace=~\"$namespace\",service=~\"$service\"}[5m]))",
              "legendFormat": "{{service}} / {{handler}}",
              "range": true,
              "refId": "A"
            },
            {
              "editorMode": "code",
              "expr": "sum by (service, handler) (rate(boutique_result_republishes_total{namespace=~\"$namespace\",service=~\"$service\"}[5m]))",
              "legendFormat": "{{service}} / {{handler}} republished",
              "range": true,
              "refId": "B"
            }
          ],
          "title": "Redeliveries and stored-result republishes",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "ops"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "id": 4,
          "options": {
            "legend": {"calcs": ["lastNotNull"], "displayMode": "table", "placement": "bottom", "showLegend": true},
            "tooltip": {"mode": "multi", "sort": "desc"}
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum by (service, claim_type, outcome) (rate(boutique_claim_outcomes_total{namespace=~\"$namespace\",service=~\"$service\"}[5m]))",
              "legendFormat": "{{service}} / {{claim_type}} / {{outcome}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Lease and bootstrap claims",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"min": 0, "unit": "short"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 16},
          "id": 5,
          "options": {
            "legend": {"calcs": ["lastNotNull", "max"], "displayMode": "table", "placement": "bottom", "showLegend": true},
            "tooltip": {"mode": "multi", "sort": "desc"}
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "max by (stream_name, consumer_name) (jetstream_consumer_num_pending)",
              "legendFormat": "{{stream_name}} / {{consumer_name}} pending",
              "range": true,
              "refId": "A"
            },
            {
              "editorMode": "code",
              "expr": "max by (stream_name, consumer_name) (jetstream_consumer_num_ack_pending)",
              "legendFormat": "{{stream_name}} / {{consumer_name}} ack-pending",
              "range": true,
              "refId": "B"
            }
          ],
          "title": "Per-consumer lag",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"min": 0, "unit": "s"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 16},
          "id": 6,
          "options": {
            "legend": {"calcs": ["lastNotNull", "max"], "displayMode": "table", "placement": "bottom", "showLegend": true},
            "tooltip": {"mode": "multi", "sort": "desc"}
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "max by (service, claim_type) (boutique_claim_lease_age_seconds{namespace=~\"$namespace\",service=~\"$service\"})",
              "legendFormat": "{{service}} / {{claim_type}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Oldest active claim",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"min": 0, "unit": "s"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 24},
          "id": 7,
          "options": {
            "legend": {"calcs": ["lastNotNull", "max"], "displayMode": "table", "placement": "bottom", "showLegend": true},
            "tooltip": {"mode": "multi", "sort": "desc"}
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum by (command) (rate(boutique_cart_command_duration_seconds_sum{namespace=~\"$namespace\"}[5m])) / clamp_min(sum by (command) (rate(boutique_cart_command_duration_seconds_count{namespace=~\"$namespace\"}[5m])), 0.001)",
              "legendFormat": "cart / {{command}} mean",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Handler publication latency",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"min": 0, "unit": "short"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 24},
          "id": 8,
          "options": {
            "legend": {"calcs": ["lastNotNull", "max"], "displayMode": "table", "placement": "bottom", "showLegend": true},
            "tooltip": {"mode": "multi", "sort": "desc"}
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum(rate(boutique_cart_redis_retries_total{namespace=~\"$namespace\"}[5m]))",
              "legendFormat": "cart Redis retries/s",
              "range": true,
              "refId": "A"
            },
            {
              "editorMode": "code",
              "expr": "sum(rate(boutique_checkout_transition_conflicts_total{namespace=~\"$namespace\"}[5m]))",
              "legendFormat": "checkout conflicts/s",
              "range": true,
              "refId": "B"
            },
            {
              "editorMode": "code",
              "expr": "max(boutique_checkout_deadline_oldest_age_seconds{namespace=~\"$namespace\"})",
              "legendFormat": "oldest checkout deadline (s)",
              "range": true,
              "refId": "C"
            }
          ],
          "title": "Redis conflicts and deadline pressure",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"min": 0, "unit": "ops"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 32},
          "id": 9,
          "options": {
            "legend": {"calcs": ["lastNotNull", "max"], "displayMode": "table", "placement": "bottom", "showLegend": true},
            "tooltip": {"mode": "multi", "sort": "desc"}
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum by (view) (rate(boutique_projection_kv_conflict_retries_total{namespace=~\"$namespace\"}[5m]))",
              "legendFormat": "{{view}} CAS retries/s",
              "range": true,
              "refId": "A"
            },
            {
              "editorMode": "code",
              "expr": "sum by (view) (rate(boutique_projection_stale_events_total{namespace=~\"$namespace\"}[5m]))",
              "legendFormat": "{{view}} stale skips/s",
              "range": true,
              "refId": "B"
            }
          ],
          "title": "Projection CAS and stale-event handling",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"min": 0, "unit": "short"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 32},
          "id": 10,
          "options": {
            "legend": {"calcs": ["lastNotNull", "max"], "displayMode": "table", "placement": "bottom", "showLegend": true},
            "tooltip": {"mode": "multi", "sort": "desc"}
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "max by (view) (boutique_projection_age_seconds{namespace=~\"$namespace\"})",
              "legendFormat": "{{view}} age (s)",
              "range": true,
              "refId": "A"
            },
            {
              "editorMode": "code",
              "expr": "max by (view) (boutique_storefront_query_revision{namespace=~\"$namespace\"})",
              "legendFormat": "{{view}} query revision",
              "range": true,
              "refId": "B"
            }
          ],
          "title": "Projection age and query revision",
          "type": "timeseries"
        }
      ],
      "refresh": "15s",
      "schemaVersion": 42,
      "tags": ["online-boutique", "stateless", "jetstream", "redis"],
      "templating": {
        "list": [
          {
            "current": {"selected": false, "text": "default", "value": "default"},
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "definition": "label_values(up{job=\"kubernetes-pods\"}, namespace)",
            "hide": 0,
            "includeAll": false,
            "label": "Namespace",
            "multi": false,
            "name": "namespace",
            "options": [],
            "query": {"query": "label_values(up{job=\"kubernetes-pods\"}, namespace)", "refId": "PrometheusVariableQueryEditor-namespace"},
            "refresh": 1,
            "regex": "",
            "skipUrlSync": false,
            "sort": 1,
            "type": "query"
          },
          {
            "allValue": ".*",
            "current": {"selected": true, "text": "All", "value": "$__all"},
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "definition": "label_values(boutique_handler_outcomes_total{namespace=~\"$namespace\"}, service)",
            "hide": 0,
            "includeAll": true,
            "label": "Service",
            "multi": true,
            "name": "service",
            "options": [],
            "query": {"query": "label_values(boutique_handler_outcomes_total{namespace=~\"$namespace\"}, service)", "refId": "PrometheusVariableQueryEditor-service"},
            "refresh": 1,
            "regex": "",
            "skipUrlSync": false,
            "sort": 1,
            "type": "query"
          }
        ]
      },
      "time": {"from": "now-1h", "to": "now"},
      "timepicker": {},
      "timezone": "browser",
      "title": "Stateless handlers and claims",
      "uid": "boutique-stateless",
      "version": 1,
      "weekStart": ""
    }
