apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability
configMapGenerator:
- name: grafana-datasources
  files:
  - datasources.yaml=grafana-datasources-config.yaml
  options:
    labels:
      app.kubernetes.io/name: grafana
      app.kubernetes.io/part-of: online-boutique-observability
resources:
- namespace.yaml
- rbac.yaml
- prometheus.yaml
- loki.yaml
- tempo.yaml
- alloy.yaml
- grafana.yaml
- grafana-dashboard.yaml
- stateless-dashboard.yaml
- network-policies.yaml
