apiVersion: apps/v1
kind: Deployment
metadata:
  name: benchmarkservice
  labels:
    app: benchmarkservice
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: benchmarkservice
  template:
    metadata:
      labels:
        app: benchmarkservice
    spec:
      serviceAccountName: benchmarkservice
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: server
        image: benchmarkservice
        env:
        - name: PORT
          value: "8080"
        - name: APPLICATION_TYPE
          value: "NATS"
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        envFrom:
        - configMapRef:
            name: nats-client-config
        - secretRef:
            name: nats-credentials-benchmarkservice
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 2
          periodSeconds: 5
          failureThreshold: 12
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 96Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: nats-ca
          mountPath: /etc/nats-ca
          readOnly: true
      volumes:
      - name: nats-ca
        configMap:
          name: nats-ca
---
apiVersion: v1
kind: Service
metadata:
  name: benchmarkservice
  labels:
    app: benchmarkservice
spec:
  selector:
    app: benchmarkservice
  ports:
  - name: http
    port: 8080
    targetPort: http
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: benchmarkservice
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: benchmark-runner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: benchmarkservice-jobs
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get"]
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: benchmarkservice-jobs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: benchmarkservice-jobs
subjects:
- kind: ServiceAccount
  name: benchmarkservice
