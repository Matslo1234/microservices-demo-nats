apiVersion: v1
kind: ServiceAccount
metadata:
  name: nats
  namespace: nats
---
apiVersion: v1
kind: Service
metadata:
  name: nats-headless
  namespace: nats
  labels:
    app.kubernetes.io/name: nats
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: nats
  ports:
  - name: client
    port: 4222
    targetPort: client
  - name: cluster
    port: 6222
    targetPort: cluster
  - name: monitor
    port: 8222
    targetPort: monitor
  - name: metrics
    port: 7777
    targetPort: metrics
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: nats
  labels:
    app.kubernetes.io/name: nats
spec:
  selector:
    app.kubernetes.io/name: nats
  ports:
  - name: client
    port: 4222
    targetPort: client
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: nats
  namespace: nats
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: nats
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
  namespace: nats
  labels:
    app.kubernetes.io/name: nats
    app.kubernetes.io/part-of: online-boutique
spec:
  serviceName: nats-headless
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: nats
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nats
        app.kubernetes.io/part-of: online-boutique
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "7777"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: nats
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: nats
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: nats
      initContainers:
      - name: volume-permissions
        image: busybox:1.37.0
        # Existing JetStream files are already owned by the server user. Only
        # the volume root needs ownership fixed when a new claim is first used.
        command: ["sh", "-ec", "chown 1000:1000 /data"]
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
            add: ["CHOWN"]
        volumeMounts:
        - name: jetstream
          mountPath: /data
      containers:
      - name: nats
        image: nats:2.14.3-alpine
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "-ec"]
        args:
        - |
          export NATS_SERVER_NAME="${REGION_ID}-${POD_NAME}"
          export NATS_NODE_TAG="node:${NODE_NAME}"
          case "${POD_NAME}" in
            nats-0) NATS_GATEWAY_ADVERTISE="${NATS_GATEWAY_ADVERTISE_0:-${POD_NAME}.${NATS_GATEWAY_DOMAIN}:7222}" ;;
            nats-1) NATS_GATEWAY_ADVERTISE="${NATS_GATEWAY_ADVERTISE_1:-${POD_NAME}.${NATS_GATEWAY_DOMAIN}:7222}" ;;
            nats-2) NATS_GATEWAY_ADVERTISE="${NATS_GATEWAY_ADVERTISE_2:-${POD_NAME}.${NATS_GATEWAY_DOMAIN}:7222}" ;;
            *) echo "unexpected NATS pod name ${POD_NAME}" >&2; exit 1 ;;
          esac
          export NATS_GATEWAY_ADVERTISE
          sed \
            -e "s|__NATS_FRONTEND_LIVE_SUBJECT__|${NATS_FRONTEND_LIVE_SUBJECT}|g" \
            -e "s|__NATS_PROJECTION_PRODUCTS_SUBJECT__|${NATS_PROJECTION_PRODUCTS_SUBJECT}|g" \
            -e "s|__NATS_PROJECTION_CARTS_SUBJECT__|${NATS_PROJECTION_CARTS_SUBJECT}|g" \
            -e "s|__NATS_PROJECTION_CONTEXT_SUBJECT__|${NATS_PROJECTION_CONTEXT_SUBJECT}|g" \
            -e "s|__NATS_PROJECTION_ORDERS_SUBJECT__|${NATS_PROJECTION_ORDERS_SUBJECT}|g" \
            -e "s|__NATS_PROJECTION_OPERATIONS_SUBJECT__|${NATS_PROJECTION_OPERATIONS_SUBJECT}|g" \
            -e "s|__NATS_BENCHMARK_RUNS_SUBJECT__|${NATS_BENCHMARK_RUNS_SUBJECT}|g" \
            -e "s|__NATS_BENCHMARK_ARTIFACTS_SUBJECT__|${NATS_BENCHMARK_ARTIFACTS_SUBJECT}|g" \
            /etc/nats-config/nats.conf > /var/run/nats/nats.conf
          cp /etc/nats-config/gateway.conf /var/run/nats/gateway.conf
          exec nats-server -c /var/run/nats/nats.conf
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        envFrom:
        - configMapRef:
            name: nats-region-config
        - secretRef:
            name: nats-server-auth
        ports:
        - name: client
          containerPort: 4222
        - name: cluster
          containerPort: 6222
        - name: gateway
          containerPort: 7222
        - name: monitor
          containerPort: 8222
        startupProbe:
          httpGet:
            path: /healthz?js-enabled-only=true
            port: monitor
          failureThreshold: 60
          periodSeconds: 2
        readinessProbe:
          httpGet:
            path: /healthz?js-enabled-only=true
            port: monitor
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz?js-server-only=true
            port: monitor
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        lifecycle:
          preStop:
            exec:
              command: ["nats-server", "-sl", "ldm=/var/run/nats/nats.pid"]
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: "2"
            # File-backed JetStream still needs process/cache headroom above
            # the retained stream data during overload and recovery.
            memory: 4Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: config
          mountPath: /etc/nats-config
          readOnly: true
        - name: tls
          mountPath: /etc/nats/tls
          readOnly: true
        - name: gateway-tls
          mountPath: /etc/nats/gateway-tls
          readOnly: true
        - name: jetstream
          mountPath: /data
        - name: run
          mountPath: /var/run/nats
      - name: metrics
        image: natsio/prometheus-nats-exporter:0.20.1
        imagePullPolicy: IfNotPresent
        args: ["-p", "7777", "-varz", "-routez", "-gatewayz", "-subz", "-jsz=all", "http://127.0.0.1:8222"]
        ports:
        - name: metrics
          containerPort: 7777
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            # Full JetStream metric snapshots briefly exceed 256 MiB once the
            # benchmark has accumulated a large order and operation surface.
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          readOnlyRootFilesystem: true
      volumes:
      - name: config
        projected:
          sources:
          - configMap:
              name: nats-server-config
          - configMap:
              name: nats-gateway-config
      - name: tls
        secret:
          secretName: nats-server-tls
      - name: gateway-tls
        secret:
          secretName: nats-gateway-tls
          optional: true
      - name: run
        emptyDir: {}
  volumeClaimTemplates:
  - metadata:
      name: jetstream
      labels:
        app.kubernetes.io/name: nats
        app.kubernetes.io/component: jetstream
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 20Gi
