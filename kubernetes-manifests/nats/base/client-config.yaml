apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-client-config
  namespace: default
  labels:
    app.kubernetes.io/name: nats-client-config
    app.kubernetes.io/part-of: online-boutique
data:
  # Standalone defaults are also the primary-region defaults. Regional
  # overlays replace this complete identity/asset contract.
  REGION_ID: local
  REGION_KEY: LOCAL
  K8S_CLUSTER_NAME: local
  NATS_CLUSTER_NAME: BOUTIQUE
  NATS_CLUSTER_ROLE: primary
  STREAM_OWNER_REGION: local
  NATS_SUPERCLUSTER_ENABLED: "false"
  NATS_URL: tls://nats.nats.svc.cluster.local:4222
  NATS_CA_FILE: /etc/nats-ca/ca.crt
  NATS_CONNECT_TIMEOUT: 2s
  NATS_RECONNECT_WAIT: 2s
  NATS_MAX_RECONNECTS: "-1"
  NATS_DRAIN_TIMEOUT: 30s
  NATS_PUBLISH_TIMEOUT: 5s
  NATS_REQUEST_TIMEOUT: 2s
  NATS_PING_INTERVAL: 20s
  NATS_MAX_PINGS_OUT: "2"
  NATS_REQUIRED: "false"
  NATS_REQUIRED_SUBSCRIPTIONS: ""
  NATS_HEALTH_MAX_DISCONNECTED: 15s
  NATS_TRACE_PROPAGATION: w3c
  STOREFRONT_EVENT_STREAM: BOUTIQUE_EVENTS
  STOREFRONT_PROJECTION_DURABLE: storefront-projection-local-v1
  STOREFRONT_PRODUCTS_BUCKET: STOREFRONT_PRODUCTS_LOCAL
  STOREFRONT_CARTS_BUCKET: STOREFRONT_CARTS_LOCAL
  STOREFRONT_CONTEXT_BUCKET: STOREFRONT_CONTEXT_LOCAL
  STOREFRONT_ORDERS_BUCKET: STOREFRONT_ORDERS_LOCAL
  STOREFRONT_OPERATIONS_BUCKET: STOREFRONT_OPERATIONS_LOCAL
  STOREFRONT_INITIAL_REPLAY_TIMEOUT: 10m
  LIVE_OPERATION_PREFIX: boutique.live.operation.local.
  BENCHMARK_RUNS_BUCKET: BENCHMARK_RUNS_LOCAL
  BENCHMARK_ARTIFACTS_BUCKET: BENCHMARK_ARTIFACTS_LOCAL
