apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-gateway-config
  namespace: nats
data:
  gateway.conf: |
    gateway {
      name: $NATS_CLUSTER_NAME
      listen: 0.0.0.0:7222
      advertise: $NATS_GATEWAY_ADVERTISE
      reject_unknown_cluster: true
      connect_retries: 120
      connect_backoff: true
      write_deadline: "10s"
      tls {
        cert_file: "/etc/nats/gateway-tls/tls.crt"
        key_file: "/etc/nats/gateway-tls/tls.key"
        ca_file: "/etc/nats/gateway-tls/ca.crt"
        min_version: "1.2"
        timeout: 5
        verify: true
      }
      gateways: [
        {
          name: "BOUTIQUE-eu-central-1"
          urls: [
            tls://k8s-nats-natsgate-2c2a33a54d-a5259d04fb10ed85.elb.eu-central-1.amazonaws.com:7222,
            tls://k8s-nats-natsgate-8f9a9906cb-6a59ef3d4ff84f12.elb.eu-central-1.amazonaws.com:7222,
            tls://k8s-nats-natsgate-a22d86f61f-f6737fcb872d12be.elb.eu-central-1.amazonaws.com:7222
          ]
        }
      ]
    }
