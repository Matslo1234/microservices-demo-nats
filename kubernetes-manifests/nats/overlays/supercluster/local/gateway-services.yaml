apiVersion: v1
kind: Service
metadata:
  name: nats-gateway-0
  namespace: nats
  labels: {app.kubernetes.io/name: nats, app.kubernetes.io/component: gateway}
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector: {statefulset.kubernetes.io/pod-name: nats-0}
  ports:
  - {name: gateway, protocol: TCP, port: 7222, targetPort: gateway}
---
