apiVersion: v1
kind: ConfigMap
metadata: {name: nats-region-config, namespace: nats}
data:
  REGION_ID: secondary-template
  REGION_KEY: SECONDARY_TEMPLATE
  K8S_CLUSTER_NAME: boutique-secondary
  NATS_CLUSTER_NAME: BOUTIQUE-secondary-template
  NATS_CLUSTER_ROLE: secondary
  NATS_SUPERCLUSTER_ENABLED: "true"
  STREAM_OWNER_REGION: local
  GLOBAL_ASSET_CLUSTER: BOUTIQUE
  NATS_REGION_TAG: region:secondary-template
  NATS_CLUSTER_TAG: cluster:BOUTIQUE-secondary-template
  NATS_GATEWAY_DOMAIN: gw.secondary-template.example.net
  NATS_GATEWAY_DNS_NAMES: nats-0.gw.secondary-template.example.net,nats-1.gw.secondary-template.example.net,nats-2.gw.secondary-template.example.net
  STOREFRONT_PROJECTION_DURABLE: storefront-projection-secondary-template-v1
  STOREFRONT_PRODUCTS_BUCKET: STOREFRONT_PRODUCTS_SECONDARY_TEMPLATE
  STOREFRONT_CARTS_BUCKET: STOREFRONT_CARTS_SECONDARY_TEMPLATE
  STOREFRONT_CONTEXT_BUCKET: STOREFRONT_CONTEXT_SECONDARY_TEMPLATE
  STOREFRONT_ORDERS_BUCKET: STOREFRONT_ORDERS_SECONDARY_TEMPLATE
  STOREFRONT_OPERATIONS_BUCKET: STOREFRONT_OPERATIONS_SECONDARY_TEMPLATE
  BENCHMARK_RUNS_BUCKET: BENCHMARK_RUNS_SECONDARY_TEMPLATE
  BENCHMARK_ARTIFACTS_BUCKET: BENCHMARK_ARTIFACTS_SECONDARY_TEMPLATE
  NATS_FRONTEND_LIVE_SUBJECT: boutique.live.operation.secondary-template.>
  NATS_PROJECTION_PRODUCTS_SUBJECT: $KV.STOREFRONT_PRODUCTS_SECONDARY_TEMPLATE.>
  NATS_PROJECTION_CARTS_SUBJECT: $KV.STOREFRONT_CARTS_SECONDARY_TEMPLATE.>
  NATS_PROJECTION_CONTEXT_SUBJECT: $KV.STOREFRONT_CONTEXT_SECONDARY_TEMPLATE.>
  NATS_PROJECTION_ORDERS_SUBJECT: $KV.STOREFRONT_ORDERS_SECONDARY_TEMPLATE.>
  NATS_PROJECTION_OPERATIONS_SUBJECT: $KV.STOREFRONT_OPERATIONS_SECONDARY_TEMPLATE.>
  NATS_BENCHMARK_RUNS_SUBJECT: $KV.BENCHMARK_RUNS_SECONDARY_TEMPLATE.>
  NATS_BENCHMARK_ARTIFACTS_SUBJECT: $O.BENCHMARK_ARTIFACTS_SECONDARY_TEMPLATE.>
