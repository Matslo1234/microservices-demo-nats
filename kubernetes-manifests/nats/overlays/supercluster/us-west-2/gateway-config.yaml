apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-gateway-config
  namespace: nats
data:
  gateway.conf: |
    gateway {
      name: $NATS_CLUSTER_NAME
      listen: 0.0.0.0:7222
      advertise: $NATS_GATEWAY_ADVERTISE
      reject_unknown_cluster: true
      connect_retries: 120
      connect_backoff: true
      write_deadline: "10s"
      tls {
        cert_file: "/etc/nats/gateway-tls/tls.crt"
        key_file: "/etc/nats/gateway-tls/tls.key"
        ca_file: "/etc/nats/gateway-tls/ca.crt"
        min_version: "1.2"
        timeout: 5
        verify: true
      }
      gateways: [
        {
          name: "BOUTIQUE-eu-central-1"
          urls: [
            tls://k8s-nats-natsgate-9a49a33457-855f8d42089a130e.elb.eu-central-1.amazonaws.com:7222,
            tls://k8s-nats-natsgate-426435f5c8-9806ed35b9fd5bbc.elb.eu-central-1.amazonaws.com:7222,
            tls://k8s-nats-natsgate-f5f85e6f3c-26aec2e4bb3bdb0e.elb.eu-central-1.amazonaws.com:7222
          ]
        }
      ]
    }
