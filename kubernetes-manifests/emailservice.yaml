apiVersion: apps/v1
kind: Deployment
metadata:
  name: emailservice
  labels:
    app: emailservice
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: emailservice
  template:
    metadata:
      labels:
        app: emailservice
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: emailservice
      terminationGracePeriodSeconds: 35
      securityContext:
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      initContainers:
      - name: wait-for-boutique-events
        image: natsio/nats-box:0.19.7-nonroot
        command:
        - sh
        - -ec
        - |
          until nats \
            --server="${NATS_URL}" \
            --user="${NATS_USER}" \
            --password="${NATS_PASSWORD}" \
            --tlsca="${NATS_CA_FILE}" \
            --timeout=2s \
            stream info BOUTIQUE_EVENTS >/dev/null 2>&1; do
            echo "waiting for the BOUTIQUE_EVENTS stream"
            sleep 2
          done
        envFrom:
        - configMapRef:
            name: nats-client-config
        - secretRef:
            name: nats-credentials-emailservice
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: nats-ca
          mountPath: /etc/nats-ca
          readOnly: true
        resources:
          requests:
            cpu: 5m
            memory: 16Mi
          limits:
            cpu: 50m
            memory: 2Gi
      containers:
      - name: server
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          privileged: false
          readOnlyRootFilesystem: true
        image: emailservice
        ports:
        - name: health
          containerPort: 8080
        env:
        - name: PORT
          value: "8080"
        - name: NATS_REQUIRED
          value: "true"
        - name: NATS_REQUIRED_SUBSCRIPTIONS
          value: "email-order-completed-v1"
        envFrom:
        - configMapRef:
            name: nats-client-config
        - secretRef:
            name: nats-credentials-emailservice
        volumeMounts:
        - name: nats-ca
          mountPath: /etc/nats-ca
          readOnly: true
        readinessProbe:
          periodSeconds: 5
          httpGet:
            path: /readyz
            port: health
        livenessProbe:
          periodSeconds: 5
          httpGet:
            path: /healthz
            port: health
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 2Gi
      volumes:
      - name: nats-ca
        configMap:
          name: nats-ca
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: emailservice
