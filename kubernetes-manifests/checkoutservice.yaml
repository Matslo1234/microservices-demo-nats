apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkoutservice
  labels:
    app: checkoutservice
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: checkoutservice
  template:
    metadata:
      labels:
        app: checkoutservice
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: checkoutservice
      terminationGracePeriodSeconds: 35
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: server
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
          image: checkoutservice
          ports:
          - name: health
            containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 5
            failureThreshold: 180
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          env:
          - name: PORT
            value: "8080"
          - name: NATS_REQUIRED
            value: "true"
          - name: NATS_REQUIRED_SUBSCRIPTIONS
            value: "checkout-catalog-v1,checkout-currency-v1,checkout-cart-v1,checkout-order-commands-v1,checkout-saga-shipping-v1,checkout-saga-payment-v1"
          - name: CHECKOUT_REDIS_ADDR
            value: redis-checkout-cluster:6379
          - name: CHECKOUT_REDIS_MODE
            value: cluster
          - name: CHECKOUT_REDIS_PREFIX
            value: checkout:v2
          - name: CHECKOUT_DEADLINE_LEASE
            value: 15s
          - name: CHECKOUT_SAGA_STEP_TIMEOUT
            value: 30s
          - name: CHECKOUT_PROJECTION_CATCHUP_TIMEOUT
            value: 10m
          - name: GOMEMLIMIT
            value: "400MiB"
          envFrom:
          - configMapRef:
              name: nats-client-config
          - secretRef:
              name: nats-credentials-checkoutservice
          volumeMounts:
          - name: nats-ca
            mountPath: /etc/nats-ca
            readOnly: true
          resources:
            requests:
              cpu: 275m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
      - name: nats-ca
        configMap:
          name: nats-ca
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: checkoutservice
