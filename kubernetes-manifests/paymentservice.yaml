apiVersion: apps/v1
kind: Deployment
metadata:
  name: paymentservice
  labels:
    app: paymentservice
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: paymentservice
  template:
    metadata:
      labels:
        app: paymentservice
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: paymentservice
      terminationGracePeriodSeconds: 35
      securityContext:
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: server
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          privileged: false
          readOnlyRootFilesystem: true
        image: paymentservice
        ports:
        - name: health
          containerPort: 8080
        env:
        - name: PORT
          value: "8080"
        - name: DISABLE_PROFILER
          value: "1"
        - name: NODE_OPTIONS
          value: "--max-old-space-size=384"
        - name: NATS_REQUIRED
          value: "true"
        - name: NATS_REQUIRED_SUBSCRIPTIONS
          value: "boutique.qry.payment.tokenize.v1,payment-commands-v1"
        - name: PAYMENT_SIGNING_KEY_ID
          value: primary-v1
        envFrom:
        - configMapRef:
            name: nats-client-config
        - secretRef:
            name: nats-credentials-paymentservice
        volumeMounts:
        - name: nats-ca
          mountPath: /etc/nats-ca
          readOnly: true
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          timeoutSeconds: 3
          failureThreshold: 6
        resources:
          requests:
            cpu: 500m
            memory: 128Mi
          limits:
            cpu: "2"
            memory: 2Gi
      volumes:
      - name: nats-ca
        configMap:
          name: nats-ca
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: paymentservice
