# The external metrics are produced from the existing Prometheus/NATS series by
# the cluster's custom-metrics adapter. CPU remains a usable fallback and any
# signal may request a scale-up; failed external metrics prevent an unsafe
# scale-down but do not disable CPU-driven scale-up.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: adservice
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: adservice
  minReplicas: 2
  maxReplicas: 10
  behavior: &behavior
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 25
        periodSeconds: 60
  metrics:
  - &cpu
    type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - &worker-lag
    type: External
    external:
      metric:
        name: boutique_jetstream_consumer_pending
        selector:
          matchLabels:
            service: adservice
      target:
        type: AverageValue
        averageValue: "25"
---
