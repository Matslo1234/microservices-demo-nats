# Phase 1 provisions fresh owner-specific Redis Cluster endpoints alongside the
# legacy endpoints. Cart and checkout switch to these endpoints only when their
# aggregate-local schemas land in phases 4 and 5.
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-cluster-bootstrap
  labels:
    app.kubernetes.io/component: backing-store
    app.kubernetes.io/part-of: online-boutique
data:
  bootstrap.sh: |
    #!/bin/sh
    set -eu

    node() {
      ordinal="$1"
      printf '%s-%s.%s.%s.svc.cluster.local' \
        "${CLUSTER_NAME}" "${ordinal}" "${HEADLESS_SERVICE}" "${POD_NAMESPACE}"
    }

    ordinal=0
    while [ "${ordinal}" -lt 6 ]; do
      host="$(node "${ordinal}")"
      until redis-cli -h "${host}" -p 6379 PING >/dev/null 2>&1; do
        echo "waiting for ${host}"
        sleep 2
      done
      ordinal=$((ordinal + 1))
    done

    seed="$(node 0)"
    if redis-cli -h "${seed}" -p 6379 CLUSTER INFO 2>/dev/null |
      grep -q '^cluster_state:ok'; then
      echo "${CLUSTER_NAME} is already healthy"
      exit 0
    fi

    known_nodes="$(redis-cli -h "${seed}" -p 6379 CLUSTER INFO 2>/dev/null |
      sed -n 's/^cluster_known_nodes:\([0-9][0-9]*\).*/\1/p')"
    if [ "${known_nodes:-1}" -gt 1 ]; then
      echo "${CLUSTER_NAME} was already created and is converging"
    else
      redis-cli --cluster create \
        "$(node 0):6379" "$(node 1):6379" "$(node 2):6379" \
        "$(node 3):6379" "$(node 4):6379" "$(node 5):6379" \
        --cluster-replicas 1 --cluster-yes
    fi

    attempts=0
    until redis-cli -h "${seed}" -p 6379 CLUSTER INFO 2>/dev/null |
      grep -q '^cluster_state:ok'; do
      attempts=$((attempts + 1))
      if [ "${attempts}" -ge 60 ]; then
        echo "${CLUSTER_NAME} did not become healthy" >&2
        exit 1
      fi
      sleep 2
    done
    redis-cli -h "${seed}" -p 6379 CLUSTER INFO
---
apiVersion: v1
kind: Service
metadata:
  name: redis-cart-cluster-headless
  labels:
    app: redis-cart-cluster
    app.kubernetes.io/component: backing-store
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: redis-cart-cluster
    app.kubernetes.io/component: server
  ports:
  - name: redis
    port: 6379
  - name: cluster-bus
    port: 16379
---
apiVersion: v1
kind: Service
metadata:
  name: redis-cart-cluster
  labels:
    app: redis-cart-cluster
    app.kubernetes.io/component: backing-store
spec:
  selector:
    app: redis-cart-cluster
    app.kubernetes.io/component: server
  ports:
  - name: redis
    port: 6379
    targetPort: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-cart-cluster
  labels:
    app: redis-cart-cluster
    app.kubernetes.io/component: backing-store
spec:
  serviceName: redis-cart-cluster-headless
  podManagementPolicy: Parallel
  replicas: 6
  selector:
    matchLabels:
      app: redis-cart-cluster
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app: redis-cart-cluster
        app.kubernetes.io/component: server
        app.kubernetes.io/part-of: online-boutique
    spec:
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: redis-cart-cluster
            app.kubernetes.io/component: server
      initContainers:
      - name: volume-permissions
        image: redis:8.2-alpine
        command: ["sh", "-ec", "chown 1000:1000 /data"]
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
            add: ["CHOWN"]
          readOnlyRootFilesystem: true
          runAsNonRoot: false
          runAsUser: 0
        volumeMounts:
        - name: data
          mountPath: /data
        resources:
          requests:
            cpu: 5m
            memory: 8Mi
          limits:
            cpu: 50m
            memory: 64Mi
      containers:
      - name: redis
        image: redis:8.2-alpine
        command: ["sh", "-ec"]
        args:
        - |
          exec redis-server \
            --bind 0.0.0.0 \
            --protected-mode no \
            --port 6379 \
            --appendonly yes \
            --appendfsync always \
            --cluster-enabled yes \
            --cluster-config-file /data/nodes.conf \
            --cluster-node-timeout 5000 \
            --cluster-announce-hostname "${POD_NAME}.redis-cart-cluster-headless.${POD_NAMESPACE}.svc.cluster.local" \
            --cluster-announce-port 6379 \
            --cluster-announce-bus-port 16379 \
            --cluster-preferred-endpoint-type hostname
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        ports:
        - name: redis
          containerPort: 6379
        - name: cluster-bus
          containerPort: 16379
        startupProbe:
          exec:
            command: ["redis-cli", "PING"]
          periodSeconds: 2
          failureThreshold: 90
        readinessProbe:
          exec:
            command: ["sh", "-ec", "redis-cli CLUSTER INFO | grep -q '^cluster_state:ok'"]
          periodSeconds: 5
        livenessProbe:
          exec:
            command: ["redis-cli", "PING"]
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: data
          mountPath: /data
        resources:
          requests:
            cpu: 50m
            memory: 96Mi
          limits:
            cpu: 500m
            memory: 512Mi
  volumeClaimTemplates:
  - metadata:
      name: data
      labels:
        app: redis-cart-cluster
        app.kubernetes.io/component: backing-store
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 2Gi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: redis-cart-cluster
spec:
  minAvailable: 5
  selector:
    matchLabels:
      app: redis-cart-cluster
      app.kubernetes.io/component: server
---
apiVersion: batch/v1
kind: Job
metadata:
  name: redis-cart-cluster-bootstrap
  labels:
    app: redis-cart-cluster-bootstrap
    app.kubernetes.io/component: bootstrap
spec:
  backoffLimit: 12
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: redis-cart-cluster-bootstrap
        app.kubernetes.io/component: bootstrap
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: bootstrap
        image: redis:8.2-alpine
        command: ["sh", "/config/bootstrap.sh"]
        env:
        - name: CLUSTER_NAME
          value: redis-cart-cluster
        - name: HEADLESS_SERVICE
          value: redis-cart-cluster-headless
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: config
          mountPath: /config
          readOnly: true
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
      volumes:
      - name: config
        configMap:
          name: redis-cluster-bootstrap
          defaultMode: 0555
---
