apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendationservice
  labels:
    app: recommendationservice
spec:
  selector:
    matchLabels:
      app: recommendationservice
  template:
    metadata:
      labels:
        app: recommendationservice
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: recommendationservice
      terminationGracePeriodSeconds: 5
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: server
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          privileged: false
          readOnlyRootFilesystem: true
        image: recommendationservice
        ports:
        - name: health
          containerPort: 8080
        readinessProbe:
          periodSeconds: 5
          timeoutSeconds: 5
          httpGet:
            path: /readyz
            port: health
        livenessProbe:
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 6
          httpGet:
            path: /healthz
            port: health
        env:
        - name: PORT
          value: "8080"
        - name: DISABLE_PROFILER
          value: "1"
        - name: NATS_REQUIRED
          value: "true"
        - name: NATS_REQUIRED_SUBSCRIPTIONS
          value: "recommendation-catalog-v1,recommendation-cart-v1,recommendation-page-views-v1"
        - name: NATS_CONSUMER_BATCH_SIZE
          value: "32"
        - name: NATS_CONSUMER_CONCURRENCY
          value: "8"
        - name: RECOMMENDATION_PAGE_VIEW_MAX_AGE
          value: "5s"
        - name: RECOMMENDATION_PAGE_VIEW_BATCH_SIZE
          value: "256"
        - name: RECOMMENDATION_PAGE_VIEW_CONCURRENCY
          value: "32"
        - name: RECOMMENDATION_CART_BATCH_SIZE
          value: "256"
        - name: RECOMMENDATION_CART_CONCURRENCY
          value: "32"
        envFrom:
        - configMapRef:
            name: nats-client-config
        - secretRef:
            name: nats-credentials-recommendationservice
        volumeMounts:
        - name: nats-ca
          mountPath: /etc/nats-ca
          readOnly: true
        resources:
          requests:
            cpu: 300m
            memory: 256Mi
          limits:
            cpu: "2"
            memory: 2Gi
      volumes:
      - name: nats-ca
        configMap:
          name: nats-ca
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: recommendationservice
